<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查表 - 基础版</title>
    <style id="theme-vars">
/* ============================================================
   AMEToolbox — MD3 Brand CSS
   Seed color: #E85D04 (Safety Orange)
   Generated via Material Design 3 ColorScheme.fromSeed()
   ============================================================ */

/* ---- Light Mode (default) ---- */
:root,
.light {
  /* MD3 Primary tonal palette */
  --ame-primary: #8F4100;
  --ame-on-primary: #FFFFFF;
  --ame-primary-container: #FFDCBE;
  --ame-on-primary-container: #2E1500;

  /* MD3 Secondary tonal palette */
  --ame-secondary: #745943;
  --ame-on-secondary: #FFFFFF;
  --ame-secondary-container: #FFDCBE;
  --ame-on-secondary-container: #2A1700;

  /* MD3 Tertiary tonal palette */
  --ame-tertiary: #5C6236;
  --ame-on-tertiary: #FFFFFF;
  --ame-tertiary-container: #E0E9AF;
  --ame-on-tertiary-container: #1A1E00;

  /* MD3 Error tonal palette */
  --ame-error: #BA1A1A;
  --ame-on-error: #FFFFFF;
  --ame-error-container: #FFDAD6;
  --ame-on-error-container: #410002;

  /* MD3 Surface / Background */
  --ame-surface: #FFF8F4;
  --ame-on-surface: #221A14;
  --ame-surface-variant: #F3DFD1;
  --ame-on-surface-variant: #51443A;
  --ame-surface-dim: #D8C8BA;
  --ame-surface-bright: #FFF8F4;
  --ame-surface-container-lowest: #FFFFFF;
  --ame-surface-container-low: #FFF1E8;
  --ame-surface-container: #FCEEE0;
  --ame-surface-container-high: #F6E8DA;
  --ame-surface-container-highest: #F1E2D5;
  --ame-inverse-surface: #382F27;
  --ame-on-inverse-surface: #FCEFE2;

  /* MD3 Outline */
  --ame-outline: #847468;
  --ame-outline-variant: #D6C3B5;

  /* Semantic state colors */
  --state-success: #2D7D46;
  --state-warning: #F9A825;
  --state-error: #C62828;
  --state-info: #1565C0;

  /* Semantic aliases (required by apply-html-head-contract) */
  --ame-background: #FFF8F4;
  --ame-foreground: #221A14;
  --ame-card: #FFFFFF;
  --ame-card-foreground: #221A14;
  --ame-popover: #FFFFFF;
  --ame-popover-foreground: #221A14;
  --ame-muted: #F3DFD1;
  --ame-muted-foreground: #51443A;
  --ame-border: #D6C3B5;
  --ame-input: #D6C3B5;
  --ame-ring: #8F4100;

  /* Radius scale (MD3) */
  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  /* Preset accent colors (for theme settings page) */
  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ---- Dark Mode ---- */
.dark {
  --ame-primary: #FFB87B;
  --ame-on-primary: #4C2700;
  --ame-primary-container: #6B3900;
  --ame-on-primary-container: #FFDCBE;

  --ame-secondary: #E3C0A5;
  --ame-on-secondary: #422C1A;
  --ame-secondary-container: #5B412E;
  --ame-on-secondary-container: #FFDCBE;

  --ame-tertiary: #C4CD94;
  --ame-on-tertiary: #2E330C;
  --ame-tertiary-container: #444A20;
  --ame-on-tertiary-container: #E0E9AF;

  --ame-error: #FFB4AB;
  --ame-on-error: #690005;
  --ame-error-container: #93000A;
  --ame-on-error-container: #FFDAD6;

  --ame-surface: #1A120D;
  --ame-on-surface: #F2DFD2;
  --ame-surface-variant: #51443A;
  --ame-on-surface-variant: #D6C3B5;
  --ame-surface-dim: #1A120D;
  --ame-surface-bright: #42342A;
  --ame-surface-container-lowest: #140D08;
  --ame-surface-container-low: #221A14;
  --ame-surface-container: #271E17;
  --ame-surface-container-high: #322821;
  --ame-surface-container-highest: #3D332B;
  --ame-inverse-surface: #F2DFD2;
  --ame-on-inverse-surface: #382F27;

  --ame-outline: #9F8D80;
  --ame-outline-variant: #51443A;

  --state-success: #7DD99A;
  --state-warning: #FFD466;
  --state-error: #FFB4AB;
  --state-info: #8AB4F8;

  --ame-background: #1A120D;
  --ame-foreground: #F2DFD2;
  --ame-card: #221A14;
  --ame-card-foreground: #F2DFD2;
  --ame-popover: #271E17;
  --ame-popover-foreground: #F2DFD2;
  --ame-muted: #51443A;
  --ame-muted-foreground: #D6C3B5;
  --ame-border: #51443A;
  --ame-input: #51443A;
  --ame-ring: #FFB87B;

  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ============================================================
   MD3 Typography (display/headline/title/body/label scales)
   ============================================================ */

.t-display-large { font-size: 57px; line-height: 64px; font-weight: 400; letter-spacing: -0.25px; }
.t-display-medium { font-size: 45px; line-height: 52px; font-weight: 400; }
.t-display-small { font-size: 36px; line-height: 44px; font-weight: 400; }

.t-headline-large { font-size: 32px; line-height: 40px; font-weight: 400; }
.t-headline-medium { font-size: 28px; line-height: 36px; font-weight: 400; }
.t-headline-small { font-size: 24px; line-height: 32px; font-weight: 400; }

.t-title-large { font-size: 22px; line-height: 28px; font-weight: 500; }
.t-title-medium { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; }
.t-title-small { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }

.t-body-large { font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: 0.5px; }
.t-body-medium { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: 0.25px; }
.t-body-small { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.4px; }

.t-label-large { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }
.t-label-medium { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }
.t-label-small { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ame-background);
    --color-foreground: var(--ame-foreground);
    --color-card: var(--ame-card);
    --color-card-foreground: var(--ame-card-foreground);
    --color-popover: var(--ame-popover);
    --color-popover-foreground: var(--ame-popover-foreground);
    --color-primary: var(--ame-primary);
    --color-secondary: var(--ame-secondary);
    --color-muted: var(--ame-muted);
    --color-muted-foreground: var(--ame-muted-foreground);
    --color-border: var(--ame-border);
    --color-input: var(--ame-input);
    --color-ring: var(--ame-ring);
    --radius-sm: var(--ame-radius-small);
    --radius-md: var(--ame-radius-medium);
    --radius-lg: var(--ame-radius-large);
  }
  @layer base {
    body { background: var(--ame-background); color: var(--ame-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ame-background); }
      .text-background { color: var(--ame-background); }
      .border-background { border-color: var(--ame-background); }
      .ring-background { --tw-ring-color: var(--ame-background); }
      .bg-foreground { background-color: var(--ame-foreground); }
      .text-foreground { color: var(--ame-foreground); }
      .border-foreground { border-color: var(--ame-foreground); }
      .ring-foreground { --tw-ring-color: var(--ame-foreground); }
      .bg-card { background-color: var(--ame-card); }
      .text-card { color: var(--ame-card); }
      .border-card { border-color: var(--ame-card); }
      .ring-card { --tw-ring-color: var(--ame-card); }
      .bg-card-foreground { background-color: var(--ame-card-foreground); }
      .text-card-foreground { color: var(--ame-card-foreground); }
      .border-card-foreground { border-color: var(--ame-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ame-card-foreground); }
      .bg-popover { background-color: var(--ame-popover); }
      .text-popover { color: var(--ame-popover); }
      .border-popover { border-color: var(--ame-popover); }
      .ring-popover { --tw-ring-color: var(--ame-popover); }
      .bg-popover-foreground { background-color: var(--ame-popover-foreground); }
      .text-popover-foreground { color: var(--ame-popover-foreground); }
      .border-popover-foreground { border-color: var(--ame-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ame-popover-foreground); }
      .bg-primary { background-color: var(--ame-primary); }
      .text-primary { color: var(--ame-primary); }
      .border-primary { border-color: var(--ame-primary); }
      .ring-primary { --tw-ring-color: var(--ame-primary); }
      .bg-secondary { background-color: var(--ame-secondary); }
      .text-secondary { color: var(--ame-secondary); }
      .border-secondary { border-color: var(--ame-secondary); }
      .ring-secondary { --tw-ring-color: var(--ame-secondary); }
      .bg-muted { background-color: var(--ame-muted); }
      .text-muted { color: var(--ame-muted); }
      .border-muted { border-color: var(--ame-muted); }
      .ring-muted { --tw-ring-color: var(--ame-muted); }
      .bg-muted-foreground { background-color: var(--ame-muted-foreground); }
      .text-muted-foreground { color: var(--ame-muted-foreground); }
      .border-muted-foreground { border-color: var(--ame-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ame-muted-foreground); }
      .bg-border { background-color: var(--ame-border); }
      .text-border { color: var(--ame-border); }
      .border-border { border-color: var(--ame-border); }

      .bg-input { background-color: var(--ame-input); }
      .text-input { color: var(--ame-input); }
      .border-input { border-color: var(--ame-input); }
      .ring-input { --tw-ring-color: var(--ame-input); }
      .bg-ring { background-color: var(--ame-ring); }
      .text-ring { color: var(--ame-ring); }
      .border-ring { border-color: var(--ame-ring); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col" style="background: var(--ame-background); color: var(--ame-foreground); max-width: 430px; margin: 0 auto;">

  <!-- App Bar with Progress Header -->
  <header class="ame-app-bar bg-surface-container border-b border-outline-variant">
    <div class="flex items-center justify-between px-4 h-14">
      <div class="flex items-center gap-2">
        <i data-lucide="clipboard-check" class="w-6 h-6 text-primary"></i>
        <span class="t-title-medium text-on-surface">检查表</span>
      </div>
      <button data-dom-id="cta-settings" class="state-layer p-2 rounded-full text-on-surface-variant hover:text-primary" aria-label="设置">
        <i data-lucide="settings" class="w-5 h-5"></i>
      </button>
    </div>
    <div class="px-4 pb-3 flex items-center gap-3">
      <span id="progress-text" class="t-label-medium text-on-surface-variant whitespace-nowrap">3/5 已完成</span>
      <div class="flex-1 h-1.5 rounded-full bg-surface-variant overflow-hidden">
        <div id="progress-bar" class="h-full rounded-full bg-primary" style="width: 60%; transition: width 200ms ease;"></div>
      </div>
      <span id="progress-pct" class="t-label-medium text-primary whitespace-nowrap">60%</span>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-28">

    <!-- Filter Chips -->
    <section class="flex gap-2 overflow-x-auto no-scrollbar">
      <button class="ame-filter-chip state-layer" data-dom-id="filter-all" data-filter="all" data-active="true">全部</button>
      <button class="ame-filter-chip state-layer" data-dom-id="filter-pending" data-filter="pending" data-active="false">待完成</button>
      <button class="ame-filter-chip state-layer" data-dom-id="filter-done" data-filter="done" data-active="false">已完成</button>
    </section>

    <!-- Checklist Items -->
    <section id="checklist-list" class="bg-surface-container-low rounded-2xl overflow-hidden">
      <!-- 1. Checked -->
      <div class="ame-checklist-item" data-item-id="1" data-checked="true" data-category="设备点检">
        <button class="ame-checkbox ame-checkbox--checked state-layer shrink-0" data-action="toggle" data-id="1" aria-label="切换完成状态">
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
        <div class="flex-1 min-w-0">
          <div class="ame-item-text t-body-large text-on-surface line-through opacity-60">检查液压系统压力</div>
          <div class="flex items-center gap-2 mt-1">
            <span class="ame-category-tag">设备点检</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="ame-item-time t-body-small" style="color: var(--state-success);">08:30 已完成</span>
          </div>
        </div>
      </div>

      <!-- 2. Checked -->
      <div class="ame-checklist-item" data-item-id="2" data-checked="true" data-category="安全检查">
        <button class="ame-checkbox ame-checkbox--checked state-layer shrink-0" data-action="toggle" data-id="2" aria-label="切换完成状态">
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
        <div class="flex-1 min-w-0">
          <div class="ame-item-text t-body-large text-on-surface line-through opacity-60">确认紧急停止按钮功能</div>
          <div class="flex items-center gap-2 mt-1">
            <span class="ame-category-tag">安全检查</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="ame-item-time t-body-small" style="color: var(--state-success);">08:35 已完成</span>
          </div>
        </div>
      </div>

      <!-- 3. Checked -->
      <div class="ame-checklist-item" data-item-id="3" data-checked="true" data-category="质量检查">
        <button class="ame-checkbox ame-checkbox--checked state-layer shrink-0" data-action="toggle" data-id="3" aria-label="切换完成状态">
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
        <div class="flex-1 min-w-0">
          <div class="ame-item-text t-body-large text-on-surface line-through opacity-60">核对产品尺寸公差</div>
          <div class="flex items-center gap-2 mt-1">
            <span class="ame-category-tag">质量检查</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="ame-item-time t-body-small" style="color: var(--state-success);">09:00 已完成</span>
          </div>
        </div>
      </div>

      <!-- 4. Unchecked -->
      <div class="ame-checklist-item" data-item-id="4" data-checked="false" data-category="设备点检">
        <button class="ame-checkbox state-layer shrink-0" data-action="toggle" data-id="4" aria-label="切换完成状态"></button>
        <div class="flex-1 min-w-0">
          <div class="ame-item-text t-body-large text-on-surface">检查传送带润滑情况</div>
          <div class="flex items-center gap-2 mt-1">
            <span class="ame-category-tag">设备点检</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="ame-item-time t-body-small text-on-surface-variant">待完成</span>
          </div>
        </div>
      </div>

      <!-- 5. Unchecked -->
      <div class="ame-checklist-item" data-item-id="5" data-checked="false" data-category="安全检查">
        <button class="ame-checkbox state-layer shrink-0" data-action="toggle" data-id="5" aria-label="切换完成状态"></button>
        <div class="flex-1 min-w-0">
          <div class="ame-item-text t-body-large text-on-surface">验证安全防护罩锁定</div>
          <div class="flex items-center gap-2 mt-1">
            <span class="ame-category-tag">安全检查</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="ame-item-time t-body-small text-on-surface-variant">待完成</span>
          </div>
        </div>
      </div>

      <!-- 6. Unchecked -->
      <div class="ame-checklist-item" data-item-id="6" data-checked="false" data-category="质量检查">
        <button class="ame-checkbox state-layer shrink-0" data-action="toggle" data-id="6" aria-label="切换完成状态"></button>
        <div class="flex-1 min-w-0">
          <div class="ame-item-text t-body-large text-on-surface">抽检成品外观质量</div>
          <div class="flex items-center gap-2 mt-1">
            <span class="ame-category-tag">质量检查</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="ame-item-time t-body-small text-on-surface-variant">待完成</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Extended FAB -->
  <button data-dom-id="fab-add-item" class="ame-fab-extended state-layer fixed bottom-24 right-4 z-20" aria-label="新增检查项">
    <i data-lucide="plus" class="w-5 h-5"></i>
    <span class="t-label-large">新增项目</span>
  </button>

  <!-- Bottom Navigation (checklist active) -->
  <nav class="ame-bottom-nav flex items-center justify-around h-16 bg-surface-container border-t border-outline-variant" data-nav-key="checklist">
    <button data-dom-id="nav-home" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="t-label-small">主页</span>
    </button>
    <button data-dom-id="nav-counter" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
      <i data-lucide="hash" class="w-6 h-6"></i>
      <span class="t-label-small">计数器</span>
    </button>
    <button data-dom-id="nav-timer" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
      <i data-lucide="timer" class="w-6 h-6"></i>
      <span class="t-label-small">计时器</span>
    </button>
    <button data-dom-id="nav-checklist" data-active="true" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-primary">
      <i data-lucide="check-square" class="w-6 h-6"></i>
      <span class="t-label-small">检查表</span>
    </button>
  </nav>

  <!-- Add Item Dialog -->
  <div id="add-dialog" class="ame-dialog-backdrop">
    <div class="ame-dialog">
      <h2 class="t-title-medium text-on-surface mb-4">新增检查项</h2>
      <div class="space-y-4 mb-6">
        <div>
          <label for="new-item-text" class="t-label-medium text-on-surface-variant block mb-1.5">检查内容</label>
          <input id="new-item-text" type="text" class="ame-input" placeholder="输入检查项内容" />
        </div>
        <div>
          <label for="new-item-category" class="t-label-medium text-on-surface-variant block mb-1.5">分类</label>
          <select id="new-item-category" class="ame-select">
            <option value="安全检查">安全检查</option>
            <option value="质量检查">质量检查</option>
            <option value="设备点检">设备点检</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button id="dialog-cancel" class="ame-text-btn state-layer">取消</button>
        <button id="dialog-confirm" class="ame-filled-btn state-layer">添加</button>
      </div>
    </div>
  </div>

  <style>
    /* ---- Utility fallbacks (ensure token utilities resolve) ---- */
    .bg-surface-container { background-color: var(--ame-surface-container); }
    .bg-surface-container-low { background-color: var(--ame-surface-container-low); }
    .bg-surface-container-high { background-color: var(--ame-surface-container-high); }
    .bg-surface-container-highest { background-color: var(--ame-surface-container-highest); }
    .bg-surface-container-lowest { background-color: var(--ame-surface-container-lowest); }
    .bg-surface-variant { background-color: var(--ame-surface-variant); }
    .bg-primary { background-color: var(--ame-primary); }
    .bg-primary-container { background-color: var(--ame-primary-container); }
    .text-on-surface { color: var(--ame-on-surface); }
    .text-on-surface-variant { color: var(--ame-on-surface-variant); }
    .text-on-primary { color: var(--ame-on-primary); }
    .text-on-primary-container { color: var(--ame-on-primary-container); }
    .text-primary { color: var(--ame-primary); }
    .border-outline { border-color: var(--ame-outline); }
    .border-outline-variant { border-color: var(--ame-outline-variant); }
    .hover\:text-primary:hover { color: var(--ame-primary); }

    /* ---- Filter Chips ---- */
    .ame-filter-chip {
      display: inline-flex; align-items: center;
      padding: 8px 16px;
      border-radius: var(--ame-radius-full);
      border: 1px solid var(--ame-outline-variant);
      background: var(--ame-surface-container-low);
      color: var(--ame-on-surface-variant);
      font-size: 12px; font-weight: 500; letter-spacing: 0.5px;
      white-space: nowrap; cursor: pointer;
      transition: background var(--ame-duration-short) ease, color var(--ame-duration-short) ease, border-color var(--ame-duration-short) ease;
    }
    .ame-filter-chip[data-active="true"] {
      background: var(--ame-primary-container);
      color: var(--ame-on-primary-container);
      border-color: transparent;
    }

    /* ---- Circular Checkbox ---- */
    .ame-checkbox {
      width: 24px; height: 24px;
      border-radius: var(--ame-radius-full);
      border: 2px solid var(--ame-outline);
      background: transparent;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ame-on-primary);
      transition: background var(--ame-duration-short) ease, border-color var(--ame-duration-short) ease;
    }
    .ame-checkbox--checked {
      background: var(--ame-primary);
      border-color: var(--ame-primary);
    }

    /* ---- Checklist Item ---- */
    .ame-checklist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
    }
    .ame-checklist-item:not(:last-child) {
      border-bottom: 1px solid var(--ame-outline-variant);
    }
    .ame-category-tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px;
      border-radius: var(--ame-radius-full);
      background: var(--ame-surface-container-highest);
      color: var(--ame-on-surface-variant);
      font-size: 11px; font-weight: 500; letter-spacing: 0.5px;
    }

    /* ---- Extended FAB ---- */
    .ame-fab-extended {
      display: inline-flex; align-items: center; gap: 8px;
      height: 56px; padding: 0 20px;
      border-radius: var(--ame-radius-large);
      background: var(--ame-primary);
      color: var(--ame-on-primary);
      border: none; cursor: pointer;
      transition: filter var(--ame-duration-short) ease;
    }
    .ame-fab-extended:hover { filter: brightness(1.05); }

    /* ---- Dialog ---- */
    .ame-dialog-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 40;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    .ame-dialog-backdrop.open { display: flex; }
    .ame-dialog {
      background: var(--ame-surface-container-high);
      border-radius: var(--ame-radius-large);
      padding: 24px;
      width: 100%; max-width: 360px;
    }
    .ame-input, .ame-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--ame-radius-small);
      background: var(--ame-surface-container-lowest);
      border: 1px solid var(--ame-outline-variant);
      color: var(--ame-on-surface);
      font-size: 14px;
      outline: none;
      transition: border-color var(--ame-duration-short) ease;
    }
    .ame-input:focus, .ame-select:focus { border-color: var(--ame-primary); }
    .ame-text-btn {
      padding: 8px 16px; border-radius: var(--ame-radius-full);
      color: var(--ame-primary); font-size: 14px; font-weight: 500;
      cursor: pointer; background: transparent; border: none;
    }
    .ame-filled-btn {
      padding: 8px 16px; border-radius: var(--ame-radius-full);
      background: var(--ame-primary); color: var(--ame-on-primary);
      font-size: 14px; font-weight: 500; cursor: pointer; border: none;
    }
  </style>

  <script>
    // ---- Checklist state ----
    const state = {
      items: [
        { id: 1, text: '检查液压系统压力',   category: '设备点检', checked: true,  time: '08:30' },
        { id: 2, text: '确认紧急停止按钮功能', category: '安全检查', checked: true,  time: '08:35' },
        { id: 3, text: '核对产品尺寸公差',   category: '质量检查', checked: true,  time: '09:00' },
        { id: 4, text: '检查传送带润滑情况',  category: '设备点检', checked: false, time: '待完成' },
        { id: 5, text: '验证安全防护罩锁定',  category: '安全检查', checked: false, time: '待完成' },
        { id: 6, text: '抽检成品外观质量',   category: '质量检查', checked: false, time: '待完成' }
      ],
      filter: 'all',
      nextId: 7
    };

    const listEl = document.getElementById('checklist-list');
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const progressPct = document.getElementById('progress-pct');
    const dialog = document.getElementById('add-dialog');

    function pad(n) { return String(n).padStart(2, '0'); }
    function nowHHMM() {
      const d = new Date();
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    // ---- Toggle checkbox ----
    function toggleItem(id) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      item.checked = !item.checked;
      item.time = item.checked ? nowHHMM() : '待完成';

      const row = listEl.querySelector('[data-item-id="' + id + '"]');
      if (!row) return;
      row.dataset.checked = item.checked ? 'true' : 'false';

      const cb = row.querySelector('.ame-checkbox');
      if (item.checked) {
        cb.classList.add('ame-checkbox--checked');
        cb.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>';
      } else {
        cb.classList.remove('ame-checkbox--checked');
        cb.innerHTML = '';
      }

      const text = row.querySelector('.ame-item-text');
      text.classList.toggle('line-through', item.checked);
      text.classList.toggle('opacity-60', item.checked);

      const time = row.querySelector('.ame-item-time');
      time.textContent = item.checked ? (item.time + ' 已完成') : '待完成';
      time.style.color = item.checked ? 'var(--state-success)' : 'var(--ame-on-surface-variant)';

      lucide.createIcons();
      applyFilter();
      updateProgress();
    }

    // ---- Filter ----
    function setFilter(filter) {
      state.filter = filter;
      document.querySelectorAll('.ame-filter-chip').forEach(chip => {
        chip.dataset.active = (chip.dataset.filter === filter) ? 'true' : 'false';
      });
      applyFilter();
    }

    function applyFilter() {
      listEl.querySelectorAll('.ame-checklist-item').forEach(row => {
        const checked = row.dataset.checked === 'true';
        let show = true;
        if (state.filter === 'pending') show = !checked;
        if (state.filter === 'done') show = checked;
        row.style.display = show ? 'flex' : 'none';
      });
    }

    // ---- Progress ----
    function updateProgress() {
      const total = state.items.length;
      const done = state.items.filter(i => i.checked).length;
      const pct = total ? Math.round((done / total) * 100) : 0;
      progressText.textContent = done + '/' + total + ' 已完成';
      progressBar.style.width = pct + '%';
      progressPct.textContent = pct + '%';
    }

    // ---- Add item dialog ----
    function openDialog() {
      dialog.classList.add('open');
      setTimeout(() => document.getElementById('new-item-text').focus(), 50);
    }
    function closeDialog() {
      dialog.classList.remove('open');
      document.getElementById('new-item-text').value = '';
    }

    function createItemRow(item) {
      const checked = item.checked;
      const checkbox = checked
        ? '<button class="ame-checkbox ame-checkbox--checked state-layer shrink-0" data-action="toggle" data-id="' + item.id + '" aria-label="切换完成状态"><i data-lucide="check" class="w-4 h-4"></i></button>'
        : '<button class="ame-checkbox state-layer shrink-0" data-action="toggle" data-id="' + item.id + '" aria-label="切换完成状态"></button>';
      const timeText = checked ? (item.time + ' 已完成') : '待完成';
      const timeColor = checked ? 'var(--state-success)' : 'var(--ame-on-surface-variant)';
      const textClass = checked ? 'ame-item-text t-body-large text-on-surface line-through opacity-60' : 'ame-item-text t-body-large text-on-surface';
      return ''
        + '<div class="ame-checklist-item" data-item-id="' + item.id + '" data-checked="' + checked + '" data-category="' + item.category + '">'
        +   checkbox
        +   '<div class="flex-1 min-w-0">'
        +     '<div class="' + textClass + '">' + item.text + '</div>'
        +     '<div class="flex items-center gap-2 mt-1">'
        +       '<span class="ame-category-tag">' + item.category + '</span>'
        +       '<span class="t-body-small text-on-surface-variant">·</span>'
        +       '<span class="ame-item-time t-body-small" style="color: ' + timeColor + ';">' + timeText + '</span>'
        +     '</div>'
        +   '</div>'
        + '</div>';
    }

    function addItem() {
      const input = document.getElementById('new-item-text');
      const text = input.value.trim();
      if (!text) { input.focus(); return; }
      const category = document.getElementById('new-item-category').value;
      const item = { id: state.nextId++, text: text, category: category, checked: false, time: '待完成' };
      state.items.push(item);
      listEl.insertAdjacentHTML('beforeend', createItemRow(item));
      closeDialog();
      lucide.createIcons();
      applyFilter();
      updateProgress();
    }

    // ---- Event wiring ----
    listEl.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-action="toggle"]');
      if (btn) toggleItem(Number(btn.dataset.id));
    });
    document.querySelectorAll('.ame-filter-chip').forEach(function (chip) {
      chip.addEventListener('click', function () { setFilter(chip.dataset.filter); });
    });
    document.getElementById('fab-add-item').addEventListener('click', openDialog);
    document.getElementById('dialog-cancel').addEventListener('click', closeDialog);
    document.getElementById('dialog-confirm').addEventListener('click', addItem);
    dialog.addEventListener('click', function (e) { if (e.target === dialog) closeDialog(); });
    document.getElementById('new-item-text').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') addItem();
    });

    lucide.createIcons();
  </script>
</body>
</html>
