<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计时器 · 基础版</title>
    <style id="theme-vars">
/* ============================================================
   AMEToolbox — MD3 Brand CSS
   Seed color: #E85D04 (Safety Orange)
   Generated via Material Design 3 ColorScheme.fromSeed()
   ============================================================ */

/* ---- Light Mode (default) ---- */
:root,
.light {
  /* MD3 Primary tonal palette */
  --ame-primary: #8F4100;
  --ame-on-primary: #FFFFFF;
  --ame-primary-container: #FFDCBE;
  --ame-on-primary-container: #2E1500;

  /* MD3 Secondary tonal palette */
  --ame-secondary: #745943;
  --ame-on-secondary: #FFFFFF;
  --ame-secondary-container: #FFDCBE;
  --ame-on-secondary-container: #2A1700;

  /* MD3 Tertiary tonal palette */
  --ame-tertiary: #5C6236;
  --ame-on-tertiary: #FFFFFF;
  --ame-tertiary-container: #E0E9AF;
  --ame-on-tertiary-container: #1A1E00;

  /* MD3 Error tonal palette */
  --ame-error: #BA1A1A;
  --ame-on-error: #FFFFFF;
  --ame-error-container: #FFDAD6;
  --ame-on-error-container: #410002;

  /* MD3 Surface / Background */
  --ame-surface: #FFF8F4;
  --ame-on-surface: #221A14;
  --ame-surface-variant: #F3DFD1;
  --ame-on-surface-variant: #51443A;
  --ame-surface-dim: #D8C8BA;
  --ame-surface-bright: #FFF8F4;
  --ame-surface-container-lowest: #FFFFFF;
  --ame-surface-container-low: #FFF1E8;
  --ame-surface-container: #FCEEE0;
  --ame-surface-container-high: #F6E8DA;
  --ame-surface-container-highest: #F1E2D5;
  --ame-inverse-surface: #382F27;
  --ame-on-inverse-surface: #FCEFE2;

  /* MD3 Outline */
  --ame-outline: #847468;
  --ame-outline-variant: #D6C3B5;

  /* Semantic state colors */
  --state-success: #2D7D46;
  --state-warning: #F9A825;
  --state-error: #C62828;
  --state-info: #1565C0;

  /* Semantic aliases (required by apply-html-head-contract) */
  --ame-background: #FFF8F4;
  --ame-foreground: #221A14;
  --ame-card: #FFFFFF;
  --ame-card-foreground: #221A14;
  --ame-popover: #FFFFFF;
  --ame-popover-foreground: #221A14;
  --ame-muted: #F3DFD1;
  --ame-muted-foreground: #51443A;
  --ame-border: #D6C3B5;
  --ame-input: #D6C3B5;
  --ame-ring: #8F4100;

  /* Radius scale (MD3) */
  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  /* Preset accent colors (for theme settings page) */
  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ---- Dark Mode ---- */
.dark {
  --ame-primary: #FFB87B;
  --ame-on-primary: #4C2700;
  --ame-primary-container: #6B3900;
  --ame-on-primary-container: #FFDCBE;

  --ame-secondary: #E3C0A5;
  --ame-on-secondary: #422C1A;
  --ame-secondary-container: #5B412E;
  --ame-on-secondary-container: #FFDCBE;

  --ame-tertiary: #C4CD94;
  --ame-on-tertiary: #2E330C;
  --ame-tertiary-container: #444A20;
  --ame-on-tertiary-container: #E0E9AF;

  --ame-error: #FFB4AB;
  --ame-on-error: #690005;
  --ame-error-container: #93000A;
  --ame-on-error-container: #FFDAD6;

  --ame-surface: #1A120D;
  --ame-on-surface: #F2DFD2;
  --ame-surface-variant: #51443A;
  --ame-on-surface-variant: #D6C3B5;
  --ame-surface-dim: #1A120D;
  --ame-surface-bright: #42342A;
  --ame-surface-container-lowest: #140D08;
  --ame-surface-container-low: #221A14;
  --ame-surface-container: #271E17;
  --ame-surface-container-high: #322821;
  --ame-surface-container-highest: #3D332B;
  --ame-inverse-surface: #F2DFD2;
  --ame-on-inverse-surface: #382F27;

  --ame-outline: #9F8D80;
  --ame-outline-variant: #51443A;

  --state-success: #7DD99A;
  --state-warning: #FFD466;
  --state-error: #FFB4AB;
  --state-info: #8AB4F8;

  --ame-background: #1A120D;
  --ame-foreground: #F2DFD2;
  --ame-card: #221A14;
  --ame-card-foreground: #F2DFD2;
  --ame-popover: #271E17;
  --ame-popover-foreground: #F2DFD2;
  --ame-muted: #51443A;
  --ame-muted-foreground: #D6C3B5;
  --ame-border: #51443A;
  --ame-input: #51443A;
  --ame-ring: #FFB87B;

  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ============================================================
   MD3 Typography (display/headline/title/body/label scales)
   ============================================================ */

.t-display-large { font-size: 57px; line-height: 64px; font-weight: 400; letter-spacing: -0.25px; }
.t-display-medium { font-size: 45px; line-height: 52px; font-weight: 400; }
.t-display-small { font-size: 36px; line-height: 44px; font-weight: 400; }

.t-headline-large { font-size: 32px; line-height: 40px; font-weight: 400; }
.t-headline-medium { font-size: 28px; line-height: 36px; font-weight: 400; }
.t-headline-small { font-size: 24px; line-height: 32px; font-weight: 400; }

.t-title-large { font-size: 22px; line-height: 28px; font-weight: 500; }
.t-title-medium { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; }
.t-title-small { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }

.t-body-large { font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: 0.5px; }
.t-body-medium { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: 0.25px; }
.t-body-small { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.4px; }

.t-label-large { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }
.t-label-medium { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }
.t-label-small { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ame-background);
    --color-foreground: var(--ame-foreground);
    --color-card: var(--ame-card);
    --color-card-foreground: var(--ame-card-foreground);
    --color-popover: var(--ame-popover);
    --color-popover-foreground: var(--ame-popover-foreground);
    --color-primary: var(--ame-primary);
    --color-secondary: var(--ame-secondary);
    --color-muted: var(--ame-muted);
    --color-muted-foreground: var(--ame-muted-foreground);
    --color-border: var(--ame-border);
    --color-input: var(--ame-input);
    --color-ring: var(--ame-ring);
    --radius-sm: var(--ame-radius-small);
    --radius-md: var(--ame-radius-medium);
    --radius-lg: var(--ame-radius-large);
  }
  @layer base {
    body { background: var(--ame-background); color: var(--ame-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ame-background); }
      .text-background { color: var(--ame-background); }
      .border-background { border-color: var(--ame-background); }
      .ring-background { --tw-ring-color: var(--ame-background); }
      .bg-foreground { background-color: var(--ame-foreground); }
      .text-foreground { color: var(--ame-foreground); }
      .border-foreground { border-color: var(--ame-foreground); }
      .ring-foreground { --tw-ring-color: var(--ame-foreground); }
      .bg-card { background-color: var(--ame-card); }
      .text-card { color: var(--ame-card); }
      .border-card { border-color: var(--ame-card); }
      .ring-card { --tw-ring-color: var(--ame-card); }
      .bg-card-foreground { background-color: var(--ame-card-foreground); }
      .text-card-foreground { color: var(--ame-card-foreground); }
      .border-card-foreground { border-color: var(--ame-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ame-card-foreground); }
      .bg-popover { background-color: var(--ame-popover); }
      .text-popover { color: var(--ame-popover); }
      .border-popover { border-color: var(--ame-popover); }
      .ring-popover { --tw-ring-color: var(--ame-popover); }
      .bg-popover-foreground { background-color: var(--ame-popover-foreground); }
      .text-popover-foreground { color: var(--ame-popover-foreground); }
      .border-popover-foreground { border-color: var(--ame-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ame-popover-foreground); }
      .bg-primary { background-color: var(--ame-primary); }
      .text-primary { color: var(--ame-primary); }
      .border-primary { border-color: var(--ame-primary); }
      .ring-primary { --tw-ring-color: var(--ame-primary); }
      .bg-secondary { background-color: var(--ame-secondary); }
      .text-secondary { color: var(--ame-secondary); }
      .border-secondary { border-color: var(--ame-secondary); }
      .ring-secondary { --tw-ring-color: var(--ame-secondary); }
      .bg-muted { background-color: var(--ame-muted); }
      .text-muted { color: var(--ame-muted); }
      .border-muted { border-color: var(--ame-muted); }
      .ring-muted { --tw-ring-color: var(--ame-muted); }
      .bg-muted-foreground { background-color: var(--ame-muted-foreground); }
      .text-muted-foreground { color: var(--ame-muted-foreground); }
      .border-muted-foreground { border-color: var(--ame-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--ame-muted-foreground); }
      .bg-border { background-color: var(--ame-border); }
      .text-border { color: var(--ame-border); }
      .border-border { border-color: var(--ame-border); }
      .ring-border { --tw-ring-color: var(--ame-border); }
      .bg-input { background-color: var(--ame-input); }
      .text-input { color: var(--ame-input); }
      .border-input { border-color: var(--ame-input); }
      .ring-input { --tw-ring-color: var(--ame-input); }
      .bg-ring { background-color: var(--ame-ring); }
      .text-ring { color: var(--ame-ring); }
      .border-ring { border-color: var(--ame-ring); }
      .ring-ring { --tw-ring-color: var(--ame-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col" style="background: var(--ame-background); color: var(--ame-foreground); max-width: 430px; margin: 0 auto;">

    <!-- App Bar -->
    <header class="ame-app-bar flex items-center justify-between px-4 h-14 bg-surface-container text-on-surface border-b border-outline-variant sticky top-0 z-10">
        <div class="flex items-center gap-2">
            <i data-lucide="factory" class="w-6 h-6 text-primary"></i>
            <span class="t-title-medium">工具台</span>
        </div>
        <div class="flex items-center gap-1">
            <span class="t-label-small text-on-surface-variant mr-1">基础版</span>
            <button data-dom-id="cta-settings" class="state-layer p-2 rounded-full text-on-surface-variant hover:text-primary" aria-label="设置">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 space-y-5">

        <!-- Mode Toggle (segmented button: count up / count down) -->
        <section class="flex bg-surface-container-low rounded-full p-1">
            <button data-dom-id="mode-countup" data-active="true" class="seg-btn state-layer flex-1 py-2 rounded-full t-label-large">
                正计时
            </button>
            <button data-dom-id="mode-countdown" data-active="false" class="seg-btn state-layer flex-1 py-2 rounded-full t-label-large">
                倒计时
            </button>
        </section>

        <!-- Circular Timer Display -->
        <section class="bg-surface-container-high rounded-3xl p-6 flex flex-col items-center">
            <div class="relative" style="width: 300px; height: 300px;">
                <svg viewBox="0 0 300 300" class="w-full h-full" style="transform: rotate(-90deg);">
                    <circle cx="150" cy="150" r="130" fill="none" class="timer-ring-track" stroke-width="14"></circle>
                    <circle id="progress-ring" cx="150" cy="150" r="130" fill="none" class="timer-ring-progress" stroke-width="14" stroke-linecap="round" stroke-dasharray="816.81" stroke-dashoffset="816.81"></circle>
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <div id="time-display" class="t-display-large text-on-surface" style="font-variant-numeric: tabular-nums; letter-spacing: -2px;">00:00</div>
                    <div id="mode-label" class="t-label-large text-on-surface-variant mt-1">正计时</div>
                    <div id="target-label" class="t-body-small text-on-surface-variant mt-0.5" style="display: none;">目标 10:00</div>
                    <div class="flex items-center justify-center gap-1.5 mt-2">
                        <div id="status-dot" class="w-2 h-2 rounded-full" style="background-color: var(--ame-outline);"></div>
                        <span id="status-text" class="t-body-small text-on-surface-variant">已暂停</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Preset Duration Chips (countdown mode only) -->
        <section id="preset-section" style="display: none;">
            <div class="t-title-small text-on-surface mb-2 px-1">预设时长</div>
            <div class="flex flex-wrap gap-2">
                <button data-dom-id="chip-5m" data-active="false" class="chip state-layer px-4 py-2 rounded-full t-label-medium">5 分钟</button>
                <button data-dom-id="chip-10m" data-active="true" class="chip state-layer px-4 py-2 rounded-full t-label-medium">10 分钟</button>
                <button data-dom-id="chip-15m" data-active="false" class="chip state-layer px-4 py-2 rounded-full t-label-medium">15 分钟</button>
                <button data-dom-id="chip-30m" data-active="false" class="chip state-layer px-4 py-2 rounded-full t-label-medium">30 分钟</button>
            </div>
        </section>

        <!-- Control Buttons -->
        <section class="flex items-center justify-center gap-5">
            <button data-dom-id="btn-reset" class="state-layer w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface" aria-label="重置">
                <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
            </button>
            <button data-dom-id="btn-start" class="state-layer bg-primary text-on-primary rounded-full h-16 px-8 flex items-center justify-center gap-2 t-title-medium" aria-label="开始">
                <i id="icon-play" data-lucide="play" class="w-7 h-7"></i>
                <i id="icon-pause" data-lucide="pause" class="w-7 h-7 hidden"></i>
                <span id="start-label">开始</span>
            </button>
            <button data-dom-id="btn-lap" data-disabled="true" class="state-layer w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface" aria-label="计次">
                <i data-lucide="flag" class="w-6 h-6"></i>
            </button>
        </section>

        <!-- Lap Times List -->
        <section>
            <div class="flex items-center justify-between mb-2 px-1">
                <span class="t-title-small text-on-surface">计次记录</span>
                <span id="lap-count" class="t-body-small text-on-surface-variant">共 0 次</span>
            </div>
            <div class="bg-surface-container-low rounded-2xl overflow-hidden">
                <div id="lap-list" class="overflow-y-auto no-scrollbar" style="max-height: 280px;">
                    <!-- lap rows injected by JS -->
                </div>
                <div id="lap-empty" class="px-4 py-6 text-center">
                    <i data-lucide="flag" class="w-6 h-6 text-on-surface-variant mx-auto mb-2"></i>
                    <div class="t-body-medium text-on-surface-variant">运行后点击计次按钮记录</div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation (timer active) -->
    <nav class="ame-bottom-nav flex items-center justify-around h-16 bg-surface-container border-t border-outline-variant sticky bottom-0 z-10" data-nav-key="timer">
        <button data-dom-id="nav-home" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="t-label-small">主页</span>
        </button>
        <button data-dom-id="nav-counter" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
            <i data-lucide="hash" class="w-6 h-6"></i>
            <span class="t-label-small">计数器</span>
        </button>
        <button data-dom-id="nav-timer" data-active="true" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-primary">
            <i data-lucide="timer" class="w-6 h-6"></i>
            <span class="t-label-small">计时器</span>
        </button>
        <button data-dom-id="nav-checklist" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
            <i data-lucide="check-square" class="w-6 h-6"></i>
            <span class="t-label-small">检查表</span>
        </button>
    </nav>

    <script>lucide.createIcons();</script>

    <!-- Custom styles + interactions (kept out of <head> per head-contract rules) -->
    <style>
      /* Critical layout (mirrors source page) */
      .ame-app-bar { position: sticky; top: 0; z-index: 10; }
      .ame-bottom-nav { position: sticky; bottom: 0; z-index: 10; }
      .ame-nav-item { position: relative; }
      .ame-nav-item[data-active="true"] { color: var(--ame-primary); }
      .ame-nav-item[data-active="true"]::before {
        content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        width: 32px; height: 3px; border-radius: 0 0 3px 3px; background: var(--ame-primary);
      }
      .state-layer { position: relative; overflow: hidden; }
      .state-layer::before {
        content: ''; position: absolute; inset: 0; background: currentColor;
        opacity: 0; transition: opacity var(--ame-duration-short) var(--ame-easing-standard);
      }
      .state-layer:hover::before { opacity: 0.08; }
      .state-layer:active::before { opacity: 0.12; }

      /* MD3 surface / outline utilities (not covered by semantic-token-fallback) */
      .bg-surface-container-lowest { background-color: var(--ame-surface-container-lowest); }
      .bg-surface-container-low { background-color: var(--ame-surface-container-low); }
      .bg-surface-container { background-color: var(--ame-surface-container); }
      .bg-surface-container-high { background-color: var(--ame-surface-container-high); }
      .bg-surface-container-highest { background-color: var(--ame-surface-container-highest); }
      .text-on-surface { color: var(--ame-on-surface); }
      .text-on-surface-variant { color: var(--ame-on-surface-variant); }
      .border-outline-variant { border-color: var(--ame-outline-variant); }
      .bg-primary-container { background-color: var(--ame-primary-container); }
      .text-on-primary-container { color: var(--ame-on-primary-container); }

      /* Segmented button */
      .seg-btn { color: var(--ame-on-surface-variant); transition: background-color var(--ame-duration-short) var(--ame-easing-standard), color var(--ame-duration-short) var(--ame-easing-standard); }
      .seg-btn[data-active="true"] { background-color: var(--ame-primary); color: var(--ame-on-primary); }

      /* Filter chips */
      .chip { background-color: var(--ame-surface-container-low); color: var(--ame-on-surface-variant); transition: background-color var(--ame-duration-short) var(--ame-easing-standard), color var(--ame-duration-short) var(--ame-easing-standard); }
      .chip[data-active="true"] { background-color: var(--ame-primary-container); color: var(--ame-on-primary-container); }

      /* Disabled control */
      [data-disabled="true"] { opacity: 0.38; pointer-events: none; }

      /* Timer ring */
      .timer-ring-track { stroke: var(--ame-surface-container-highest); }
      .timer-ring-progress { stroke: var(--ame-primary); transition: stroke-dashoffset 250ms var(--ame-easing-standard); }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
      (function () {
        'use strict';

        // ---- Timer state ----
        var state = {
          running: false,
          mode: 'countup',     // 'countup' | 'countdown'
          elapsed: 0,          // seconds counted up (for both modes)
          target: 10 * 60,     // countdown target in seconds (default 10 min)
          laps: [],            // [{ split, total }] chronological
          lastLapTotal: 0,
          intervalId: null
        };

        // Seed example lap history (#1 00:05:23, #2 00:10:15, #3 00:15:42)
        state.laps = [
          { split: 5 * 60 + 23, total: 5 * 60 + 23 },
          { split: 4 * 60 + 52, total: 10 * 60 + 15 },
          { split: 5 * 60 + 27, total: 15 * 60 + 42 }
        ];
        state.lastLapTotal = 15 * 60 + 42;

        // ---- DOM refs ----
        var RING_CIRCUMFERENCE = 2 * Math.PI * 130; // r=130 -> 816.81
        var timeDisplay = document.getElementById('time-display');
        var modeLabel = document.getElementById('mode-label');
        var targetLabel = document.getElementById('target-label');
        var statusDot = document.getElementById('status-dot');
        var statusText = document.getElementById('status-text');
        var progressRing = document.getElementById('progress-ring');
        var startLabel = document.getElementById('start-label');
        var presetSection = document.getElementById('preset-section');
        var lapList = document.getElementById('lap-list');
        var lapEmpty = document.getElementById('lap-empty');
        var lapCount = document.getElementById('lap-count');

        var btnStart = document.querySelector('[data-dom-id="btn-start"]');
        var btnReset = document.querySelector('[data-dom-id="btn-reset"]');
        var btnLap = document.querySelector('[data-dom-id="btn-lap"]');
        var modeCountup = document.querySelector('[data-dom-id="mode-countup"]');
        var modeCountdown = document.querySelector('[data-dom-id="mode-countdown"]');
        var chips = {
          'chip-5m': { el: document.querySelector('[data-dom-id="chip-5m"]'), minutes: 5 },
          'chip-10m': { el: document.querySelector('[data-dom-id="chip-10m"]'), minutes: 10 },
          'chip-15m': { el: document.querySelector('[data-dom-id="chip-15m"]'), minutes: 15 },
          'chip-30m': { el: document.querySelector('[data-dom-id="chip-30m"]'), minutes: 30 }
        };

        // ---- Time formatting ----
        function pad(n) { return String(n).padStart(2, '0'); }
        function fmt(totalSec) {
          var s = Math.max(0, Math.floor(totalSec));
          var h = Math.floor(s / 3600);
          var m = Math.floor((s % 3600) / 60);
          var sec = s % 60;
          if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(sec);
          return pad(m) + ':' + pad(sec);
        }

        // ---- Display + ring update ----
        function updateDisplay() {
          var shown;
          if (state.mode === 'countdown') {
            shown = Math.max(0, state.target - state.elapsed);
          } else {
            shown = state.elapsed;
          }
          timeDisplay.textContent = fmt(shown);

          var progress;
          if (state.mode === 'countdown') {
            progress = state.target > 0 ? (state.target - state.elapsed) / state.target : 0;
          } else {
            // seconds-hand style: fill within the current minute
            progress = (state.elapsed % 60) / 60;
          }
          progress = Math.max(0, Math.min(1, progress));
          progressRing.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - progress));
        }

        function updateStatus() {
          if (state.running) {
            statusDot.style.backgroundColor = 'var(--state-success)';
            statusText.textContent = '运行中';
          } else {
            statusDot.style.backgroundColor = 'var(--ame-outline)';
            statusText.textContent = '已暂停';
          }
        }

        function setStartUI(running) {
          startLabel.textContent = running ? '暂停' : '开始';
          var iconPlay = document.getElementById('icon-play');
          var iconPause = document.getElementById('icon-pause');
          if (iconPlay) iconPlay.classList.toggle('hidden', running);
          if (iconPause) iconPause.classList.toggle('hidden', !running);
        }

        function setLapDisabled(disabled) {
          if (disabled) {
            btnLap.setAttribute('data-disabled', 'true');
          } else {
            btnLap.removeAttribute('data-disabled');
          }
        }

        // ---- Core timer functions ----
        function tick() {
          state.elapsed++;
          if (state.mode === 'countdown' && state.elapsed >= state.target) {
            state.elapsed = state.target;
            updateDisplay();
            pause();
            return;
          }
          updateDisplay();
        }

        function start() {
          if (state.running) { pause(); return; }
          state.running = true;
          setStartUI(true);
          setLapDisabled(false);
          updateStatus();
          state.intervalId = setInterval(tick, 1000);
        }

        function pause() {
          state.running = false;
          if (state.intervalId) { clearInterval(state.intervalId); state.intervalId = null; }
          setStartUI(false);
          setLapDisabled(true);
          updateStatus();
        }

        function reset() {
          pause();
          state.elapsed = 0;
          state.laps = [];
          state.lastLapTotal = 0;
          updateDisplay();
          renderLaps();
        }

        function lap() {
          if (!state.running) return;
          var total = state.elapsed;
          var split = total - state.lastLapTotal;
          state.lastLapTotal = total;
          state.laps.push({ split: split, total: total });
          renderLaps();
        }

        // ---- Lap list rendering ----
        function renderLaps() {
          lapList.innerHTML = '';
          if (state.laps.length === 0) {
            lapList.style.display = 'none';
            lapEmpty.style.display = '';
            lapCount.textContent = '共 0 次';
            return;
          }
          lapEmpty.style.display = 'none';
          lapList.style.display = '';
          lapCount.textContent = '共 ' + state.laps.length + ' 次';

          state.laps.forEach(function (entry, idx) {
            var n = idx + 1;
            var row = document.createElement('div');
            row.className = 'flex items-center gap-3 px-4 py-3 border-b border-outline-variant last:border-b-0';
            row.innerHTML =
              '<span class="t-title-small text-primary w-8 shrink-0">#' + n + '</span>' +
              '<div class="flex-1 flex items-baseline justify-between">' +
                '<div>' +
                  '<div class="t-body-small text-on-surface-variant">计次</div>' +
                  '<div class="t-body-large text-on-surface" style="font-variant-numeric: tabular-nums;">' + fmt(entry.split) + '</div>' +
                '</div>' +
                '<div class="text-right">' +
                  '<div class="t-body-small text-on-surface-variant">累计</div>' +
                  '<div class="t-body-large text-on-surface" style="font-variant-numeric: tabular-nums;">' + fmt(entry.total) + '</div>' +
                '</div>' +
              '</div>';
            lapList.appendChild(row);
          });
          // keep the latest lap in view when scrollable
          lapList.scrollTop = lapList.scrollHeight;
        }

        // ---- Mode handling ----
        function setMode(mode) {
          state.mode = mode;
          var isCountdown = mode === 'countdown';
          modeCountup.setAttribute('data-active', String(!isCountdown));
          modeCountdown.setAttribute('data-active', String(isCountdown));
          modeLabel.textContent = isCountdown ? '倒计时' : '正计时';
          presetSection.style.display = isCountdown ? '' : 'none';
          if (isCountdown) {
            targetLabel.style.display = '';
            targetLabel.textContent = '目标 ' + fmt(state.target);
          } else {
            targetLabel.style.display = 'none';
          }
          pause();
          state.elapsed = 0;
          state.lastLapTotal = 0;
          updateDisplay();
        }

        // ---- Preset chip handling ----
        function setTarget(minutes, activeChipId) {
          state.target = minutes * 60;
          Object.keys(chips).forEach(function (id) {
            chips[id].el.setAttribute('data-active', String(id === activeChipId));
          });
          targetLabel.textContent = '目标 ' + fmt(state.target);
          pause();
          state.elapsed = 0;
          state.lastLapTotal = 0;
          updateDisplay();
        }

        // ---- Wire up events ----
        btnStart.addEventListener('click', start);
        btnReset.addEventListener('click', reset);
        btnLap.addEventListener('click', lap);
        modeCountup.addEventListener('click', function () { setMode('countup'); });
        modeCountdown.addEventListener('click', function () { setMode('countdown'); });
        Object.keys(chips).forEach(function (id) {
          var c = chips[id];
          c.el.addEventListener('click', function () { setTarget(c.minutes, id); });
        });

        // ---- Initial render ----
        setStartUI(false);
        setLapDisabled(true);
        updateStatus();
        updateDisplay();
        renderLaps();
      })();
    </script>
</body>
</html>
