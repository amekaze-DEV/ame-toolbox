<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模块管理 · 基础版</title>
    <style id="theme-vars">
/* ============================================================
   AMEToolbox — MD3 Brand CSS
   Seed color: #E85D04 (Safety Orange)
   Generated via Material Design 3 ColorScheme.fromSeed()
   ============================================================ */

/* ---- Light Mode (default) ---- */
:root,
.light {
  /* MD3 Primary tonal palette */
  --ame-primary: #8F4100;
  --ame-on-primary: #FFFFFF;
  --ame-primary-container: #FFDCBE;
  --ame-on-primary-container: #2E1500;

  /* MD3 Secondary tonal palette */
  --ame-secondary: #745943;
  --ame-on-secondary: #FFFFFF;
  --ame-secondary-container: #FFDCBE;
  --ame-on-secondary-container: #2A1700;

  /* MD3 Tertiary tonal palette */
  --ame-tertiary: #5C6236;
  --ame-on-tertiary: #FFFFFF;
  --ame-tertiary-container: #E0E9AF;
  --ame-on-tertiary-container: #1A1E00;

  /* MD3 Error tonal palette */
  --ame-error: #BA1A1A;
  --ame-on-error: #FFFFFF;
  --ame-error-container: #FFDAD6;
  --ame-on-error-container: #410002;

  /* MD3 Surface / Background */
  --ame-surface: #FFF8F4;
  --ame-on-surface: #221A14;
  --ame-surface-variant: #F3DFD1;
  --ame-on-surface-variant: #51443A;
  --ame-surface-dim: #D8C8BA;
  --ame-surface-bright: #FFF8F4;
  --ame-surface-container-lowest: #FFFFFF;
  --ame-surface-container-low: #FFF1E8;
  --ame-surface-container: #FCEEE0;
  --ame-surface-container-high: #F6E8DA;
  --ame-surface-container-highest: #F1E2D5;
  --ame-inverse-surface: #382F27;
  --ame-on-inverse-surface: #FCEFE2;

  /* MD3 Outline */
  --ame-outline: #847468;
  --ame-outline-variant: #D6C3B5;

  /* Semantic state colors */
  --state-success: #2D7D46;
  --state-warning: #F9A825;
  --state-error: #C62828;
  --state-info: #1565C0;

  /* Semantic aliases (required by apply-html-head-contract) */
  --ame-background: #FFF8F4;
  --ame-foreground: #221A14;
  --ame-card: #FFFFFF;
  --ame-card-foreground: #221A14;
  --ame-popover: #FFFFFF;
  --ame-popover-foreground: #221A14;
  --ame-muted: #F3DFD1;
  --ame-muted-foreground: #51443A;
  --ame-border: #D6C3B5;
  --ame-input: #D6C3B5;
  --ame-ring: #8F4100;

  /* Radius scale (MD3) */
  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  /* Preset accent colors (for theme settings page) */
  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ---- Dark Mode ---- */
.dark {
  --ame-primary: #FFB87B;
  --ame-on-primary: #4C2700;
  --ame-primary-container: #6B3900;
  --ame-on-primary-container: #FFDCBE;

  --ame-secondary: #E3C0A5;
  --ame-on-secondary: #422C1A;
  --ame-secondary-container: #5B412E;
  --ame-on-secondary-container: #FFDCBE;

  --ame-tertiary: #C4CD94;
  --ame-on-tertiary: #2E330C;
  --ame-tertiary-container: #444A20;
  --ame-on-tertiary-container: #E0E9AF;

  --ame-error: #FFB4AB;
  --ame-on-error: #690005;
  --ame-error-container: #93000A;
  --ame-on-error-container: #FFDAD6;

  --ame-surface: #1A120D;
  --ame-on-surface: #F2DFD2;
  --ame-surface-variant: #51443A;
  --ame-on-surface-variant: #D6C3B5;
  --ame-surface-dim: #1A120D;
  --ame-surface-bright: #42342A;
  --ame-surface-container-lowest: #140D08;
  --ame-surface-container-low: #221A14;
  --ame-surface-container: #271E17;
  --ame-surface-container-high: #322821;
  --ame-surface-container-highest: #3D332B;
  --ame-inverse-surface: #F2DFD2;
  --ame-on-inverse-surface: #382F27;

  --ame-outline: #9F8D80;
  --ame-outline-variant: #51443A;

  --state-success: #7DD99A;
  --state-warning: #FFD466;
  --state-error: #FFB4AB;
  --state-info: #8AB4F8;

  --ame-background: #1A120D;
  --ame-foreground: #F2DFD2;
  --ame-card: #221A14;
  --ame-card-foreground: #F2DFD2;
  --ame-popover: #271E17;
  --ame-popover-foreground: #F2DFD2;
  --ame-muted: #51443A;
  --ame-muted-foreground: #D6C3B5;
  --ame-border: #51443A;
  --ame-input: #51443A;
  --ame-ring: #FFB87B;

  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ============================================================
   MD3 Typography (display/headline/title/body/label scales)
   ============================================================ */

.t-display-large { font-size: 57px; line-height: 64px; font-weight: 400; letter-spacing: -0.25px; }
.t-display-medium { font-size: 45px; line-height: 52px; font-weight: 400; }
.t-display-small { font-size: 36px; line-height: 44px; font-weight: 400; }

.t-headline-large { font-size: 32px; line-height: 40px; font-weight: 400; }

.t-title-large { font-size: 22px; line-height: 28px; font-weight: 500; }
.t-title-medium { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; }
.t-title-small { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }

.t-body-large { font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: 0.5px; }
.t-body-medium { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: 0.25px; }
.t-body-small { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.4px; }

.t-label-large { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }
.t-label-medium { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }
.t-label-small { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>

<body class="min-h-screen font-sans antialiased" style="background: var(--ame-background); color: var(--ame-foreground); max-width: 430px; margin: 0 auto;">

  <!-- ============ Enhanced App Bar ============ -->
  <header class="ame-subpage-bar bg-surface-container border-b border-outline-variant sticky top-0 z-10">
    <div class="flex items-center gap-2 px-4 h-14">
      <button data-dom-id="back-settings" class="state-layer p-2 rounded-full text-on-surface hover:text-primary" aria-label="返回设置">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </button>
      <div class="flex-1 min-w-0">
        <div class="t-title-medium text-on-surface leading-tight">模块管理</div>
        <div class="t-body-small text-on-surface-variant leading-tight" id="app-bar-subtitle">3 个已启用 · 共 3 个模块</div>
      </div>
    </div>
  </header>

  <main class="pb-6">

    <!-- ============ Summary Card ============ -->
    <section class="mx-4 mt-4 rounded-2xl bg-surface-container-low p-4">
      <div class="grid grid-cols-3 gap-3">
        <div class="flex flex-col">
          <span class="t-headline-small text-primary leading-none" id="summary-enabled">3</span>
          <span class="t-body-small text-on-surface-variant mt-1">已启用模块</span>
        </div>
        <div class="flex flex-col border-l border-outline-variant pl-3">
          <span class="t-headline-small text-on-surface leading-none" id="summary-storage">2.4 MB</span>
          <span class="t-body-small text-on-surface-variant mt-1">存储占用</span>
        </div>
        <div class="flex flex-col border-l border-outline-variant pl-3">
          <span class="t-headline-small text-on-surface leading-none">今天 09:32</span>
          <span class="t-body-small text-on-surface-variant mt-1">上次同步</span>
        </div>
      </div>
    </section>

    <!-- ============ Module List ============ -->
    <div class="px-4 pt-5 pb-2">
      <span class="t-label-large text-primary font-medium">模块列表</span>
    </div>

    <div class="bg-surface-container-low rounded-2xl mx-4 overflow-hidden" id="module-list">

      <!-- Counter module -->
      <div class="ame-module-tile flex items-center gap-4 px-4 py-3 border-b border-outline-variant" data-module="counter" data-enabled="true" data-storage="820">
        <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0">
          <i data-lucide="hash" class="w-5 h-5 text-primary"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="t-body-large text-on-surface">计数器</div>
          <div class="t-body-small text-on-surface-variant">产线计数工具，支持目标设定和批次记录</div>
          <div class="t-body-small text-on-surface-variant mt-1">今日: 1,248 件 · 存储: 820 KB · 版本: v1.0</div>
        </div>
        <div class="md3-switch state-layer" data-dom-id="switch-counter" data-checked="true" role="switch" tabindex="0" aria-label="启用计数器模块">
          <div class="md3-switch-thumb"></div>
        </div>
      </div>

      <!-- Timer module -->
      <div class="ame-module-tile flex items-center gap-4 px-4 py-3 border-b border-outline-variant" data-module="timer" data-enabled="true" data-storage="650">
        <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0">
          <i data-lucide="timer" class="w-5 h-5 text-primary"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="t-body-large text-on-surface">计时器</div>
          <div class="t-body-small text-on-surface-variant">正倒计时工具，支持预设和计次</div>
          <div class="t-body-small text-on-surface-variant mt-1">今日: 3h 24m · 存储: 650 KB · 版本: v1.0</div>
        </div>
        <div class="md3-switch state-layer" data-dom-id="switch-timer" data-checked="true" role="switch" tabindex="0" aria-label="启用计时器模块">
          <div class="md3-switch-thumb"></div>
        </div>
      </div>

      <!-- Checklist module -->
      <div class="ame-module-tile flex items-center gap-4 px-4 py-3" data-module="checklist" data-enabled="true" data-storage="930">
        <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0">
          <i data-lucide="list-checks" class="w-5 h-5 text-primary"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="t-body-large text-on-surface">检查表</div>
          <div class="t-body-small text-on-surface-variant">检查清单工具，支持分类和过滤</div>
          <div class="t-body-small text-on-surface-variant mt-1">今日: 3/5 完成 · 存储: 930 KB · 版本: v1.0</div>
        </div>
        <div class="md3-switch state-layer" data-dom-id="switch-checklist" data-checked="true" role="switch" tabindex="0" aria-label="启用检查表模块">
          <div class="md3-switch-thumb"></div>
        </div>
      </div>

    </div>

    <!-- ============ Reorder Hint ============ -->
    <div class="px-4 py-3 flex items-center justify-center gap-1.5">
      <i data-lucide="grip-horizontal" class="w-4 h-4 text-on-surface-variant"></i>
      <span class="t-body-small text-on-surface-variant">长按拖拽可调整模块顺序</span>
    </div>

    <!-- ============ Empty State Placeholder ============ -->
    <section id="empty-state" class="hidden flex-col items-center justify-center py-16 px-4 text-center">
      <i data-lucide="package-open" class="w-12 h-12 text-on-surface-variant mb-3"></i>
      <div class="t-title-medium text-on-surface">暂无已启用模块</div>
      <div class="t-body-small text-on-surface-variant mt-1">请在上方启用至少一个模块</div>
    </section>

  </main>

  <!-- ============ Custom styles (placed before </body>) ============ -->
  <style>
    .ame-subpage-bar { position: sticky; top: 0; z-index: 10; }

    /* MD3 Switch — matches settings page */
    .md3-switch {
      position: relative;
      width: 52px;
      height: 32px;
      border-radius: var(--ame-radius-full);
      border: 2px solid var(--ame-outline);
      background: var(--ame-surface-variant);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color var(--ame-duration-short) var(--ame-easing-standard),
                  border-color var(--ame-duration-short) var(--ame-easing-standard);
    }
    .md3-switch[data-checked="true"] {
      background: var(--ame-primary);
      border-color: var(--ame-primary);
    }
    .md3-switch-thumb {
      position: absolute;
      top: 50%;
      left: 6px;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border-radius: var(--ame-radius-full);
      background: var(--ame-outline);
      transition: transform var(--ame-duration-short) var(--ame-easing-standard),
                  width var(--ame-duration-short) var(--ame-easing-standard),
                  height var(--ame-duration-short) var(--ame-easing-standard),
                  background-color var(--ame-duration-short) var(--ame-easing-standard),
                  left var(--ame-duration-short) var(--ame-easing-standard);
    }
    .md3-switch[data-checked="true"] .md3-switch-thumb {
      background: var(--ame-on-primary);
      width: 24px;
      height: 24px;
      left: 22px;
    }

    /* State layer (hover/press/focus overlay) */
    .state-layer { position: relative; overflow: hidden; }
    .state-layer::before {
      content: "";
      position: absolute;
      inset: 0;
      background: currentColor;
      opacity: 0;
      transition: opacity var(--ame-duration-short) var(--ame-easing-standard);
      pointer-events: none;
      border-radius: inherit;
    }
    .state-layer:hover::before { opacity: 0.08; }
    .state-layer:focus-visible::before { opacity: 0.10; }
    .state-layer:active::before { opacity: 0.12; }

    /* Dimmed / muted appearance for disabled module tiles */
    .ame-module-tile {
      transition: opacity var(--ame-duration-short) var(--ame-easing-standard);
    }
    .ame-module-tile[data-enabled="false"] {
      opacity: 0.45;
    }
    .ame-module-tile[data-enabled="false"] .text-primary {
      color: var(--ame-on-surface-variant);
    }

    /* Empty state helper (Tailwind's `hidden` uses display:none, this keeps flex when shown) */
    #empty-state.is-visible { display: flex; }
  </style>

  <!-- ============ JavaScript interactions ============ -->
  <script>
    (function () {
      // Re-render Lucide icons after DOM is ready
      lucide.createIcons();

      var switches = document.querySelectorAll('.md3-switch');
      var moduleTiles = document.querySelectorAll('.ame-module-tile');
      var summaryEnabled = document.getElementById('summary-enabled');
      var summaryStorage = document.getElementById('summary-storage');
      var appBarSubtitle = document.getElementById('app-bar-subtitle');
      var emptyState = document.getElementById('empty-state');
      var moduleList = document.getElementById('module-list');

      function formatKB(kb) {
        if (kb >= 1024) {
          return (kb / 1024).toFixed(1) + ' MB';
        }
        return kb + ' KB';
      }

      function updateSummary() {
        var enabledCount = 0;
        var enabledStorage = 0;
        moduleTiles.forEach(function (tile) {
          if (tile.getAttribute('data-enabled') === 'true') {
            enabledCount++;
            enabledStorage += parseInt(tile.getAttribute('data-storage') || '0', 10);
          }
        });

        if (summaryEnabled) summaryEnabled.textContent = enabledCount;
        if (summaryStorage) summaryStorage.textContent = formatKB(enabledStorage);
        if (appBarSubtitle) {
          appBarSubtitle.textContent = enabledCount + ' 个已启用 · 共 ' + moduleTiles.length + ' 个模块';
        }

        // Toggle empty state visibility
        if (emptyState && moduleList) {
          if (enabledCount === 0) {
            emptyState.classList.remove('hidden');
            emptyState.classList.add('is-visible');
            moduleList.classList.add('hidden');
          } else {
            emptyState.classList.add('hidden');
            emptyState.classList.remove('is-visible');
            moduleList.classList.remove('hidden');
          }
        }
      }

      function toggleSwitch(sw) {
        var checked = sw.getAttribute('data-checked') === 'true';
        var next = !checked;
        sw.setAttribute('data-checked', next ? 'true' : 'false');
        sw.setAttribute('aria-checked', next ? 'true' : 'false');

        // Update the parent tile enabled state
        var tile = sw.closest('.ame-module-tile');
        if (tile) {
          tile.setAttribute('data-enabled', next ? 'true' : 'false');
        }

        updateSummary();
      }

      switches.forEach(function (sw) {
        sw.addEventListener('click', function () { toggleSwitch(sw); });
        sw.addEventListener('keydown', function (e) {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            toggleSwitch(sw);
          }
        });
      });

      // Initial sync
      updateSummary();
    })();
  </script>
</body>
</html>
