/* ============================================================
   AMEToolbox — MD3 Brand CSS
   Seed color: #E85D04 (Safety Orange)
   Generated via Material Design 3 ColorScheme.fromSeed()
   ============================================================ */

/* ---- Light Mode (default) ---- */
:root,
.light {
  /* MD3 Primary tonal palette */
  --ame-primary: #8F4100;
  --ame-on-primary: #FFFFFF;
  --ame-primary-container: #FFDCBE;
  --ame-on-primary-container: #2E1500;

  /* MD3 Secondary tonal palette */
  --ame-secondary: #745943;
  --ame-on-secondary: #FFFFFF;
  --ame-secondary-container: #FFDCBE;
  --ame-on-secondary-container: #2A1700;

  /* MD3 Tertiary tonal palette */
  --ame-tertiary: #5C6236;
  --ame-on-tertiary: #FFFFFF;
  --ame-tertiary-container: #E0E9AF;
  --ame-on-tertiary-container: #1A1E00;

  /* MD3 Error tonal palette */
  --ame-error: #BA1A1A;
  --ame-on-error: #FFFFFF;
  --ame-error-container: #FFDAD6;
  --ame-on-error-container: #410002;

  /* MD3 Surface / Background */
  --ame-surface: #FFF8F4;
  --ame-on-surface: #221A14;
  --ame-surface-variant: #F3DFD1;
  --ame-on-surface-variant: #51443A;
  --ame-surface-dim: #D8C8BA;
  --ame-surface-bright: #FFF8F4;
  --ame-surface-container-lowest: #FFFFFF;
  --ame-surface-container-low: #FFF1E8;
  --ame-surface-container: #FCEEE0;
  --ame-surface-container-high: #F6E8DA;
  --ame-surface-container-highest: #F1E2D5;
  --ame-inverse-surface: #382F27;
  --ame-on-inverse-surface: #FCEFE2;

  /* MD3 Outline */
  --ame-outline: #847468;
  --ame-outline-variant: #D6C3B5;

  /* Semantic state colors */
  --state-success: #2D7D46;
  --state-warning: #F9A825;
  --state-error: #C62828;
  --state-info: #1565C0;

  /* Semantic aliases (required by apply-html-head-contract) */
  --ame-background: #FFF8F4;
  --ame-foreground: #221A14;
  --ame-card: #FFFFFF;
  --ame-card-foreground: #221A14;
  --ame-popover: #FFFFFF;
  --ame-popover-foreground: #221A14;
  --ame-muted: #F3DFD1;
  --ame-muted-foreground: #51443A;
  --ame-border: #D6C3B5;
  --ame-input: #D6C3B5;
  --ame-ring: #8F4100;

  /* Radius scale (MD3) */
  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  /* Preset accent colors (for theme settings page) */
  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ---- Dark Mode ---- */

  --ame-on-primary: #4C2700;
  --ame-primary-container: #6B3900;
  --ame-on-primary-container: #FFDCBE;

  --ame-secondary: #E3C0A5;
  --ame-on-secondary: #422C1A;
  --ame-secondary-container: #5B412E;
  --ame-on-secondary-container: #FFDCBE;

  --ame-tertiary: #C4CD94;
  --ame-on-tertiary: #2E330C;
  --ame-tertiary-container: #444A20;
  --ame-on-tertiary-container: #E0E9AF;

  --ame-error: #FFB4AB;
  --ame-on-error: #690005;
  --ame-error-container: #93000A;
  --ame-on-error-container: #FFDAD6;

  --ame-surface: #1A120D;

  --ame-surface-variant: #51443A;
  --ame-on-surface-variant: #D6C3B5;
  --ame-surface-dim: #1A120D;
  --ame-surface-bright: #42342A;
  --ame-surface-container-lowest: #140D08;
  --ame-surface-container-low: #221A14;
  --ame-surface-container: #271E17;
  --ame-surface-container-high: #322821;
  --ame-surface-container-highest: #3D332B;
  --ame-inverse-surface: #F2DFD2;
  --ame-on-inverse-surface: #382F27;

  --ame-outline: #9F8D80;
  --ame-outline-variant: #51443A;

  --state-success: #7DD99A;
  --state-warning: #FFD466;
  --state-error: #FFB4AB;
  --state-info: #8AB4F8;

  --ame-background: #1A120D;
  --ame-foreground: #F2DFD2;
  --ame-card: #221A14;
  --ame-card-foreground: #F2DFD2;
  --ame-popover: #271E17;
  --ame-popover-foreground: #F2DFD2;
  --ame-muted: #51443A;
  --ame-muted-foreground: #D6C3B5;
  --ame-border: #51443A;
  --ame-input: #51443A;
  --ame-ring: #FFB87B;

  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

<body class="min-h-screen font-sans antialiased flex flex-col" style="background: var(--ame-background); color: var(--ame-foreground); max-width: 430px; margin: 0 auto;">
  <header class="ame-app-bar flex items-center justify-between px-4 h-14 bg-surface-container text-on-surface border-b border-outline-variant">
    <div class="flex items-center gap-2">
      <i data-lucide="factory" class="w-6 h-6 text-primary"></i>
      <span class="t-title-medium">工具台</span>
    </div>
    <button data-dom-id="cta-settings" class="state-layer p-2 rounded-full text-on-surface-variant hover:text-primary" aria-label="设置">
      <i data-lucide="settings" class="w-5 h-5"></i>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto p-4 space-y-4">
    <!-- Progress Summary Card -->
    <section class="bg-surface-container-high rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-primary-container flex items-center justify-center shrink-0">
            <i data-lucide="clipboard-check" class="w-5 h-5 text-primary"></i>
          </div>
          <div>
            <div class="t-title-medium text-on-surface">设备点检</div>
            <div class="t-body-small text-on-surface-variant">今日 · 3/5 完成</div>
          </div>
        </div>
        <span class="t-headline-small text-primary font-medium">60%</span>
      </div>
      <div class="h-2 rounded-full bg-surface-variant overflow-hidden">
        <div class="h-full rounded-full bg-primary" style="width: 60%;"></div>
      </div>
    </section>

    <!-- Category Tabs -->
    <section class="flex gap-2 overflow-x-auto no-scrollbar">

      <button class="state-layer px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant t-label-medium whitespace-nowrap">设备</button>

      <button class="state-layer px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant t-label-medium whitespace-nowrap">质量</button>
    </section>

    <!-- Checklist Items -->

      <!-- 1. Completed: 检查液压系统压力 -->
      <div class="flex items-center gap-3 px-4 py-3 border-b border-outline-variant">

        </div>
        <div class="flex-1 min-w-0">
          <div class="t-body-large text-on-surface line-through opacity-60">检查液压系统压力</div>
          <div class="flex items-center gap-2 mt-0.5">
            <span class="t-body-small text-on-surface-variant">设备</span>
            <span class="t-body-small text-on-surface-variant">·</span>
            <span class="t-body-small" style="color: var(--state-success);">08:30 已完成</span>
          </div>
        </div>
      </div>

      <!-- 2. Completed: 检查传送带运转 -->
      <div class="flex items-center gap-3 px-4 py-3 border-b border-outline-variant">
        <div class="w-6 h-6 rounded-md border-2 flex items-center justify-center shrink-0" style="background-color: var(--ame-primary); border-color: var(--ame-primary);">

        </div>
