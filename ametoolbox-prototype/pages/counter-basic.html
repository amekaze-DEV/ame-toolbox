<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计数器 - 基础版</title>
    <style id="theme-vars">
/* ============================================================
   AMEToolbox — MD3 Brand CSS
   Seed color: #E85D04 (Safety Orange)
   Generated via Material Design 3 ColorScheme.fromSeed()
   ============================================================ */

/* ---- Light Mode (default) ---- */
:root,
.light {
  /* MD3 Primary tonal palette */
  --ame-primary: #8F4100;
  --ame-on-primary: #FFFFFF;
  --ame-primary-container: #FFDCBE;
  --ame-on-primary-container: #2E1500;

  /* MD3 Secondary tonal palette */
  --ame-secondary: #745943;
  --ame-on-secondary: #FFFFFF;
  --ame-secondary-container: #FFDCBE;
  --ame-on-secondary-container: #2A1700;

  /* MD3 Tertiary tonal palette */
  --ame-tertiary: #5C6236;
  --ame-on-tertiary: #FFFFFF;
  --ame-tertiary-container: #E0E9AF;
  --ame-on-tertiary-container: #1A1E00;

  /* MD3 Error tonal palette */
  --ame-error: #BA1A1A;
  --ame-on-error: #FFFFFF;
  --ame-error-container: #FFDAD6;
  --ame-on-error-container: #410002;

  /* MD3 Surface / Background */
  --ame-surface: #FFF8F4;
  --ame-on-surface: #221A14;
  --ame-surface-variant: #F3DFD1;
  --ame-on-surface-variant: #51443A;
  --ame-surface-dim: #D8C8BA;
  --ame-surface-bright: #FFF8F4;
  --ame-surface-container-lowest: #FFFFFF;
  --ame-surface-container-low: #FFF1E8;
  --ame-surface-container: #FCEEE0;
  --ame-surface-container-high: #F6E8DA;
  --ame-surface-container-highest: #F1E2D5;
  --ame-inverse-surface: #382F27;
  --ame-on-inverse-surface: #FCEFE2;

  /* MD3 Outline */
  --ame-outline: #847468;
  --ame-outline-variant: #D6C3B5;

  /* Semantic state colors */
  --state-success: #2D7D46;
  --state-warning: #F9A825;
  --state-error: #C62828;
  --state-info: #1565C0;

  /* Semantic aliases (required by apply-html-head-contract) */
  --ame-background: #FFF8F4;
  --ame-foreground: #221A14;
  --ame-card: #FFFFFF;
  --ame-card-foreground: #221A14;
  --ame-popover: #FFFFFF;
  --ame-popover-foreground: #221A14;
  --ame-muted: #F3DFD1;
  --ame-muted-foreground: #51443A;
  --ame-border: #D6C3B5;
  --ame-input: #D6C3B5;
  --ame-ring: #8F4100;

  /* Radius scale (MD3) */
  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  /* Preset accent colors (for theme settings page) */
  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ---- Dark Mode ---- */
.dark {
  --ame-primary: #FFB87B;
  --ame-on-primary: #4C2700;
  --ame-primary-container: #6B3900;
  --ame-on-primary-container: #FFDCBE;

  --ame-secondary: #E3C0A5;
  --ame-on-secondary: #422C1A;
  --ame-secondary-container: #5B412E;
  --ame-on-secondary-container: #FFDCBE;

  --ame-tertiary: #C4CD94;
  --ame-on-tertiary: #2E330C;
  --ame-tertiary-container: #444A20;
  --ame-on-tertiary-container: #E0E9AF;

  --ame-error: #FFB4AB;
  --ame-on-error: #690005;
  --ame-error-container: #93000A;
  --ame-on-error-container: #FFDAD6;

  --ame-surface: #1A120D;
  --ame-on-surface: #F2DFD2;
  --ame-surface-variant: #51443A;
  --ame-on-surface-variant: #D6C3B5;
  --ame-surface-dim: #1A120D;
  --ame-surface-bright: #42342A;
  --ame-surface-container-lowest: #140D08;
  --ame-surface-container-low: #221A14;
  --ame-surface-container: #271E17;
  --ame-surface-container-high: #322821;
  --ame-surface-container-highest: #3D332B;
  --ame-inverse-surface: #F2DFD2;
  --ame-on-inverse-surface: #382F27;

  --ame-outline: #9F8D80;
  --ame-outline-variant: #51443A;

  --state-success: #7DD99A;
  --state-warning: #FFD466;
  --state-error: #FFB4AB;
  --state-info: #8AB4F8;

  --ame-background: #1A120D;
  --ame-foreground: #F2DFD2;
  --ame-card: #221A14;
  --ame-card-foreground: #F2DFD2;
  --ame-popover: #271E17;
  --ame-popover-foreground: #F2DFD2;
  --ame-muted: #51443A;
  --ame-muted-foreground: #D6C3B5;
  --ame-border: #51443A;
  --ame-input: #51443A;
  --ame-ring: #FFB87B;

  --ame-radius-small: 4px;
  --ame-radius-medium: 12px;
  --ame-radius-large: 16px;
  --ame-radius-full: 9999px;

  --preset-safety-orange: #E85D04;
  --preset-industrial-blue: #1565C0;
  --preset-safety-green: #2D7D46;
  --preset-warning-red: #C62828;
  --preset-purple: #6A1B9A;
  --preset-yellow: #F9A825;

  /* MD3 Motion tokens */
  --ame-duration-short: 200ms;
  --ame-duration-medium: 300ms;
  --ame-duration-long: 450ms;
  --ame-easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --ame-easing-emphasized: cubic-bezier(0.2, 0, 0, 1);
}

/* ============================================================
   MD3 Typography (display/headline/title/body/label scales)
   ============================================================ */

.t-display-large { font-size: 57px; line-height: 64px; font-weight: 400; letter-spacing: -0.25px; }
.t-display-medium { font-size: 45px; line-height: 52px; font-weight: 400; }
.t-display-small { font-size: 36px; line-height: 44px; font-weight: 400; }

.t-headline-large { font-size: 32px; line-height: 40px; font-weight: 400; }
.t-headline-medium { font-size: 28px; line-height: 36px; font-weight: 400; }
.t-headline-small { font-size: 24px; line-height: 32px; font-weight: 400; }

.t-title-large { font-size: 22px; line-height: 28px; font-weight: 500; }
.t-title-medium { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0.15px; }
.t-title-small { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }

.t-body-large { font-size: 16px; line-height: 24px; font-weight: 400; letter-spacing: 0.5px; }
.t-body-medium { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: 0.25px; }
.t-body-small { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: 0.4px; }

.t-label-large { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; }
.t-label-medium { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }
.t-label-small { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: 0.5px; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ame-background);
    --color-foreground: var(--ame-foreground);
    --color-card: var(--ame-card);
    --color-card-foreground: var(--ame-card-foreground);
    --color-popover: var(--ame-popover);
    --color-popover-foreground: var(--ame-popover-foreground);
    --color-primary: var(--ame-primary);
    --color-secondary: var(--ame-secondary);
    --color-muted: var(--ame-muted);
    --color-muted-foreground: var(--ame-muted-foreground);
    --color-border: var(--ame-border);
    --color-input: var(--ame-input);
    --color-ring: var(--ame-ring);
    --radius-sm: var(--ame-radius-small);
    --radius-md: var(--ame-radius-medium);
    --radius-lg: var(--ame-radius-large);
  }
  @layer base {
    body { background: var(--ame-background); color: var(--ame-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--ame-background); }
      .text-background { color: var(--ame-background); }
      .border-background { border-color: var(--ame-background); }
      .ring-background { --tw-ring-color: var(--ame-background); }
      .bg-foreground { background-color: var(--ame-foreground); }
      .text-foreground { color: var(--ame-foreground); }
      .border-foreground { border-color: var(--ame-foreground); }
      .ring-foreground { --tw-ring-color: var(--ame-foreground); }
      .bg-card { background-color: var(--ame-card); }
      .text-card { color: var(--ame-card); }
      .border-card { border-color: var(--ame-card); }
      .ring-card { --tw-ring-color: var(--ame-card); }
      .bg-card-foreground { background-color: var(--ame-card-foreground); }
      .text-card-foreground { color: var(--ame-card-foreground); }
      .border-card-foreground { border-color: var(--ame-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--ame-card-foreground); }
      .bg-popover { background-color: var(--ame-popover); }
      .text-popover { color: var(--ame-popover); }
      .border-popover { border-color: var(--ame-popover); }

      .bg-popover-foreground { background-color: var(--ame-popover-foreground); }
      .text-popover-foreground { color: var(--ame-popover-foreground); }
      .border-popover-foreground { border-color: var(--ame-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--ame-popover-foreground); }
      .bg-primary { background-color: var(--ame-primary); }
      .text-primary { color: var(--ame-primary); }
      .border-primary { border-color: var(--ame-primary); }
      .ring-primary { --tw-ring-color: var(--ame-primary); }
      .bg-secondary { background-color: var(--ame-secondary); }
      .text-secondary { color: var(--ame-secondary); }
      .border-secondary { border-color: var(--ame-secondary); }
      .ring-secondary { --tw-ring-color: var(--ame-secondary); }
      .bg-muted { background-color: var(--ame-muted); }
      .text-muted { color: var(--ame-muted); }
      .border-muted { border-color: var(--ame-muted); }
      .ring-muted { --tw-ring-color: var(--ame-muted); }
      .bg-muted-foreground { background-color: var(--ame-muted-foreground); }
      .text-muted-foreground { color: var(--ame-muted-foreground); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

</head>
<body class="min-h-screen font-sans antialiased flex flex-col" style="background: var(--ame-background); color: var(--ame-foreground); max-width: 430px; margin: 0 auto;">

  <!-- App Bar -->
  <header class="ame-app-bar flex items-center justify-between px-4 h-14 bg-surface-container text-on-surface border-b border-outline-variant sticky top-0 z-10">
    <div class="flex items-center gap-2">
      <i data-lucide="factory" class="w-6 h-6 text-primary"></i>
      <span class="t-title-medium">工具台</span>
    </div>
    <button data-dom-id="cta-settings" class="state-layer p-2 rounded-full text-on-surface-variant hover:text-primary" aria-label="设置">
      <i data-lucide="settings" class="w-5 h-5"></i>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto p-4 space-y-5">

    <!-- Counter Display Card with Circular Progress Ring -->
    <section class="counter-display bg-surface-container-high rounded-3xl p-6 text-center flex flex-col items-center">
      <div class="relative" style="width: 220px; height: 220px;">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="90" fill="none" stroke="var(--ame-surface-variant)" stroke-width="16"/>
          <circle id="progress-ring" cx="110" cy="110" r="90" fill="none"
                  stroke="var(--ame-primary)" stroke-width="16" stroke-linecap="round"
                  stroke-dasharray="565.49" stroke-dashoffset="214.89"
                  transform="rotate(-90 110 110)"
                  style="transition: stroke-dashoffset 0.4s cubic-bezier(0.2, 0, 0, 1);"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <div class="t-display-large text-primary font-medium" id="counter-value">1,248</div>
        </div>
      </div>
      <div class="t-body-medium text-on-surface-variant mt-3">今日产线计数</div>
      <div class="t-body-small text-on-surface-variant mt-1 flex items-center justify-center gap-1">
        <span>目标: <span id="target-display">2,000</span></span>
        <span>·</span>
        <span>已完成 <span id="progress-percent">62</span>%</span>
        <button data-dom-id="btn-target-settings" class="state-layer p-1 rounded-full text-on-surface-variant hover:text-primary ml-1" aria-label="设置目标">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </section>

    <!-- Control Buttons -->
    <section class="flex items-center justify-center gap-4">
      <button data-dom-id="btn-decrement" class="state-layer w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface" aria-label="减少">
        <i data-lucide="minus" class="w-7 h-7"></i>
      </button>
      <button data-dom-id="btn-reset" class="state-layer px-6 h-14 rounded-full bg-surface-container-highest flex items-center justify-center gap-2 text-on-surface-variant" aria-label="重置">
        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
        <span class="t-label-large">重置</span>
      </button>
      <button data-dom-id="btn-increment" class="state-layer w-16 h-16 rounded-full bg-primary flex items-center justify-center text-on-primary" aria-label="增加">
        <i data-lucide="plus" class="w-7 h-7"></i>
      </button>
    </section>

    <!-- Statistics Summary -->
    <section class="bg-surface-container-low rounded-2xl p-4">
      <div class="grid grid-cols-3 gap-2">
        <div class="text-center">
          <div class="t-body-small text-on-surface-variant">今日</div>
          <div class="t-headline-small text-primary mt-1">1,248</div>
        </div>
        <div class="text-center border-x border-outline-variant">
          <div class="t-body-small text-on-surface-variant">本周</div>
          <div class="t-headline-small text-primary mt-1">8,456</div>
        </div>
        <div class="text-center">
          <div class="t-body-small text-on-surface-variant">总计</div>
          <div class="t-headline-small text-primary mt-1">42,930</div>
        </div>
      </div>
    </section>

    <!-- Batch Records -->
    <section>
      <div class="flex items-center justify-between mb-2 px-1">
        <span class="t-title-small text-on-surface">批次记录</span>
        <a href="#" data-dom-id="link-view-all" class="t-body-small text-primary">查看全部</a>
      </div>
      <div class="bg-surface-container-low rounded-2xl overflow-hidden">
        <!-- Batch #12 -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-outline-variant">
          <i data-lucide="package" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
          <div class="flex-1 min-w-0">
            <div class="t-body-large text-on-surface">批次 #12</div>
            <div class="t-body-small text-on-surface-variant">08:30 · 85 件</div>
          </div>
          <div class="flex items-center gap-1">
            <i data-lucide="arrow-up" class="w-4 h-4" style="color: var(--state-success);"></i>
            <span class="t-label-large text-primary">85</span>
          </div>
        </div>
        <!-- Batch #11 -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-outline-variant">
          <i data-lucide="package" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
          <div class="flex-1 min-w-0">
            <div class="t-body-large text-on-surface">批次 #11</div>
            <div class="t-body-small text-on-surface-variant">07:15 · 92 件</div>
          </div>
          <div class="flex items-center gap-1">
            <i data-lucide="arrow-up" class="w-4 h-4" style="color: var(--state-success);"></i>
            <span class="t-label-large text-primary">92</span>
          </div>
        </div>
        <!-- Batch #10 -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-outline-variant">
          <i data-lucide="package" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
          <div class="flex-1 min-w-0">
            <div class="t-body-large text-on-surface">批次 #10</div>
            <div class="t-body-small text-on-surface-variant">06:00 · 78 件</div>
          </div>
          <div class="flex items-center gap-1">
            <i data-lucide="arrow-down" class="w-4 h-4" style="color: var(--state-error);"></i>
            <span class="t-label-large text-primary">78</span>
          </div>
        </div>
        <!-- Batch #9 -->
        <div class="flex items-center gap-3 px-4 py-3">
          <i data-lucide="package" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
          <div class="flex-1 min-w-0">
            <div class="t-body-large text-on-surface">批次 #9</div>
            <div class="t-body-small text-on-surface-variant">05:00 · 103 件</div>
          </div>
          <div class="flex items-center gap-1">
            <i data-lucide="arrow-up" class="w-4 h-4" style="color: var(--state-success);"></i>
            <span class="t-label-large text-primary">103</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="ame-bottom-nav flex items-center justify-around h-16 bg-surface-container border-t border-outline-variant sticky bottom-0 z-10" data-nav-key="counter">
    <button data-dom-id="nav-home" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="t-label-small">主页</span>
    </button>
    <button data-dom-id="nav-counter" data-active="true" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-primary">
      <i data-lucide="hash" class="w-6 h-6"></i>
      <span class="t-label-small">计数器</span>
    </button>
    <button data-dom-id="nav-timer" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
      <i data-lucide="timer" class="w-6 h-6"></i>
      <span class="t-label-small">计时器</span>
    </button>
    <button data-dom-id="nav-checklist" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
      <i data-lucide="check-square" class="w-6 h-6"></i>
      <span class="t-label-small">检查表</span>
    </button>
  </nav>

  <!-- Target Setting Dialog -->
  <div id="target-dialog-backdrop" class="fixed inset-0 z-50 bg-black/40 items-center justify-center" style="display: none;">
    <div class="bg-surface-container rounded-3xl p-6 mx-8 w-full max-w-sm">
      <div class="t-title-large text-on-surface mb-4">设置目标</div>
      <div class="mb-4">
        <label class="t-body-small text-on-surface-variant block mb-2">目标数量</label>
        <input id="target-input" type="number" value="2000" min="0"
               class="w-full h-12 px-4 rounded-xl bg-surface-container-highest text-on-surface t-body-large border border-outline-variant focus:outline-none focus:border-primary" />
      </div>
      <div class="mb-6">
        <div class="t-body-small text-on-surface-variant mb-2">快速设置</div>
        <div class="flex flex-wrap gap-2">
          <button data-dom-id="chip-500" class="target-chip state-layer px-4 py-2 rounded-full bg-surface-container-high text-on-surface t-label-medium" data-value="500">500</button>
          <button data-dom-id="chip-1000" class="target-chip state-layer px-4 py-2 rounded-full bg-surface-container-high text-on-surface t-label-medium" data-value="1000">1,000</button>
          <button data-dom-id="chip-2000" class="target-chip state-layer px-4 py-2 rounded-full bg-surface-container-high text-on-surface t-label-medium" data-value="2000">2,000</button>
          <button data-dom-id="chip-3000" class="target-chip state-layer px-4 py-2 rounded-full bg-surface-container-high text-on-surface t-label-medium" data-value="3000">3,000</button>
        </div>
      </div>
      <div class="flex justify-end gap-2">
        <button data-dom-id="btn-target-cancel" class="state-layer px-6 py-2.5 rounded-full text-primary t-label-large">取消</button>
        <button data-dom-id="btn-target-confirm" class="state-layer px-6 py-2.5 rounded-full bg-primary text-on-primary t-label-large">确认</button>
      </div>
    </div>
  </div>

  <!-- Custom Styles (placed before </body> per head contract rules) -->
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    [data-icon] {
      display: inline-flex; align-items: center; justify-content: center;
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
      background-color: currentColor;
    }
    /* Critical layout */
    .ame-app-bar { position: sticky; top: 0; z-index: 10; }
    .ame-bottom-nav { position: sticky; bottom: 0; z-index: 10; }
    .ame-nav-item { position: relative; }
    .ame-nav-item[data-active="true"] { color: var(--ame-primary); }
    .ame-nav-item[data-active="true"]::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 32px; height: 3px; border-radius: 0 0 3px 3px; background: var(--ame-primary);
    }
    /* MD3 surface utility fallbacks */
    .bg-surface { background-color: var(--ame-surface); }
    .bg-surface-container { background-color: var(--ame-surface-container); }
    .bg-surface-container-low { background-color: var(--ame-surface-container-low); }
    .bg-surface-container-high { background-color: var(--ame-surface-container-high); }
    .bg-surface-container-highest { background-color: var(--ame-surface-container-highest); }
    .bg-surface-variant { background-color: var(--ame-surface-variant); }
    .text-on-surface { color: var(--ame-on-surface); }
    .text-on-surface-variant { color: var(--ame-on-surface-variant); }
    .text-on-primary { color: var(--ame-on-primary); }
    .border-outline-variant { border-color: var(--ame-outline-variant); }
    /* MD3 state layer interaction */
    .state-layer { position: relative; overflow: hidden; transition: background-color var(--ame-duration-short) var(--ame-easing-standard); cursor: pointer; border: none; }
    .state-layer:hover { background-color: color-mix(in srgb, currentColor 8%, transparent); }
    .state-layer:active { background-color: color-mix(in srgb, currentColor 12%, transparent); }
    /* Target chip active state */
    .target-chip.active { background-color: var(--ame-primary); color: var(--ame-on-primary); }
  </style>

  <!-- JavaScript Interactions -->
  <script>
    // Counter state
    let count = 1248;
    let target = 2000;
    const radius = 90;
    const circumference = 2 * Math.PI * radius;

    // DOM elements
    const counterValue = document.getElementById('counter-value');
    const targetDisplay = document.getElementById('target-display');
    const progressPercent = document.getElementById('progress-percent');
    const progressRing = document.getElementById('progress-ring');
    const targetDialogBackdrop = document.getElementById('target-dialog-backdrop');
    const targetInput = document.getElementById('target-input');

    // Format number with commas
    function formatNumber(n) {
      return n.toLocaleString('en-US');
    }

    // Update display and progress ring
    function updateDisplay() {
      counterValue.textContent = formatNumber(count);
      targetDisplay.textContent = formatNumber(target);
      const percent = target > 0 ? Math.min(100, Math.round((count / target) * 100)) : 0;
      progressPercent.textContent = percent;
      const dashoffset = circumference * (1 - percent / 100);
      progressRing.style.strokeDashoffset = dashoffset;
    }

    // Increment
    document.getElementById('btn-increment').addEventListener('click', function() {
      count++;
      updateDisplay();
    });

    // Decrement
    document.getElementById('btn-decrement').addEventListener('click', function() {
      if (count > 0) count--;
      updateDisplay();
    });

    // Reset
    document.getElementById('btn-reset').addEventListener('click', function() {
      count = 0;
      updateDisplay();
    });

    // Target dialog show/hide
    function showTargetDialog() {
      targetInput.value = target;
      updateChipActiveState();
      targetDialogBackdrop.style.display = 'flex';
    }

    function hideTargetDialog() {
      targetDialogBackdrop.style.display = 'none';
    }

    function updateChipActiveState() {
      document.querySelectorAll('.target-chip').forEach(function(chip) {
        if (parseInt(chip.dataset.value, 10) === target) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });
    }

    // Target settings button
    document.getElementById('btn-target-settings').addEventListener('click', showTargetDialog);

    // Cancel button
    document.getElementById('btn-target-cancel').addEventListener('click', hideTargetDialog);

    // Confirm button - updates target and progress ring
    document.getElementById('btn-target-confirm').addEventListener('click', function() {
      var val = parseInt(targetInput.value, 10);
      if (val > 0) {
        target = val;
        updateDisplay();
      }
      hideTargetDialog();
    });

    // Quick-set chip click handlers
    document.querySelectorAll('.target-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var val = parseInt(chip.dataset.value, 10);
        targetInput.value = val;
        document.querySelectorAll('.target-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
      });
    });

    // Close dialog on backdrop click
    targetDialogBackdrop.addEventListener('click', function(e) {
      if (e.target === targetDialogBackdrop) {
        hideTargetDialog();
      }
    });

    // Initialize
    progressRing.style.strokeDasharray = circumference;
    updateDisplay();
    lucide.createIcons();
  </script>
</body>
</html>
