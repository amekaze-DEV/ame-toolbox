<!-- ============================================================
     AMEToolbox — Home Navigation Shared Fragment
     Shared by: home-portrait, home-landscape, counter, timer, checklist
     Contains: app bar, bottom nav (portrait), rail nav (landscape),
               module card template, sync status card template
     Leaf pages INLINE these patterns — this file is the canonical reference.
     ============================================================ -->

<!-- ===== SHARED: MD3 App Bar (portrait + landscape) ===== -->
<!-- Active nav key is set via data-nav-key on the nav element -->
<header class="ame-app-bar flex items-center justify-between px-4 h-14 bg-surface-container text-on-surface border-b border-outline-variant">
  <div class="flex items-center gap-2">
    <i data-lucide="factory" class="w-6 h-6 text-primary"></i>
    <span class="t-title-medium">工具台</span>
  </div>
  <button data-dom-id="cta-settings" class="state-layer p-2 rounded-full text-on-surface-variant hover:text-primary" aria-label="设置">
    <i data-lucide="settings" class="w-5 h-5"></i>
  </button>
</header>

<!-- ===== SHARED: Bottom Navigation (portrait mode) ===== -->
<!-- Canonical HTML from mobileNavigation.structure.canonicalHtmlByKey -->
<!-- Each page sets its own active key; data-dom-id on nav items for interaction wiring -->
<nav class="ame-bottom-nav flex items-center justify-around h-16 bg-surface-container border-t border-outline-variant" data-nav-key="home">
  <button data-dom-id="nav-home" data-active="true" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-primary">
    <i data-lucide="home" class="w-6 h-6"></i>
    <span class="t-label-small">主页</span>
  </button>
  <button data-dom-id="nav-counter" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
    <i data-lucide="hash" class="w-6 h-6"></i>
    <span class="t-label-small">计数器</span>
  </button>
  <button data-dom-id="nav-timer" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
    <i data-lucide="timer" class="w-6 h-6"></i>
    <span class="t-label-small">计时器</span>
  </button>
  <button data-dom-id="nav-checklist" class="ame-nav-item state-layer flex flex-col items-center justify-center gap-1 flex-1 h-full text-on-surface-variant">
    <i data-lucide="check-square" class="w-6 h-6"></i>
    <span class="t-label-small">检查表</span>
  </button>
</nav>

<!-- ===== SHARED: Rail Navigation (landscape mode) ===== -->
<!-- Settings entry fixed at rail bottom; nav items scrollable -->
<aside class="ame-rail-nav w-20 flex flex-col bg-surface-container border-r border-outline-variant">
  <div class="flex-1 overflow-y-auto no-scrollbar flex flex-col">
    <button data-dom-id="nav-home" data-active="true" class="ame-rail-item state-layer flex flex-col items-center justify-center gap-1 h-20 text-primary">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="t-label-small">主页</span>
    </button>
    <button data-dom-id="nav-counter" class="ame-rail-item state-layer flex flex-col items-center justify-center gap-1 h-20 text-on-surface-variant">
      <i data-lucide="hash" class="w-6 h-6"></i>
      <span class="t-label-small">计数器</span>
    </button>
    <button data-dom-id="nav-timer" class="ame-rail-item state-layer flex flex-col items-center justify-center gap-1 h-20 text-on-surface-variant">
      <i data-lucide="timer" class="w-6 h-6"></i>
      <span class="t-label-small">计时器</span>
    </button>
    <button data-dom-id="nav-checklist" class="ame-rail-item state-layer flex flex-col items-center justify-center gap-1 h-20 text-on-surface-variant">
      <i data-lucide="check-square" class="w-6 h-6"></i>
      <span class="t-label-small">检查表</span>
    </button>
  </div>
  <button data-dom-id="cta-settings" class="ame-rail-item state-layer flex flex-col items-center justify-center gap-1 h-20 text-on-surface-variant border-t border-outline-variant">
    <i data-lucide="settings" class="w-6 h-6"></i>
    <span class="t-label-small">设置</span>
  </button>
</aside>

<!-- ===== SHARED: Module Card Template (home pages) ===== -->
<!-- data-dom-id on the card enables interaction wiring to module pages -->
<div class="ame-module-card state-layer bg-surface-container-high rounded-2xl p-4 flex items-center gap-4 cursor-pointer" data-dom-id="link-counter">
  <div class="w-12 h-12 rounded-xl bg-primary-container flex items-center justify-center shrink-0">
    <i data-lucide="hash" class="w-6 h-6 text-primary"></i>
  </div>
  <div class="flex-1 min-w-0">
    <div class="t-title-medium text-on-surface">计数器</div>
    <div class="t-body-small text-on-surface-variant">今日产线计数</div>
  </div>
  <div class="t-headline-small text-primary font-medium">1,248</div>
</div>

<!-- ===== SHARED: Sync Status Card Template (home pages, fixed last) ===== -->
<div class="ame-sync-card bg-surface-container-high rounded-2xl p-4 flex items-center gap-4">
  <div class="w-10 h-10 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center shrink-0">
    <div class="w-3 h-3 rounded-full" style="background-color: var(--state-success);"></div>
  </div>
  <div class="flex-1">
    <div class="t-title-medium text-on-surface">数据已同步</div>
    <div class="t-body-small text-on-surface-variant">10:42 · 自动同步</div>
  </div>
  <i data-lucide="check-circle" class="w-5 h-5" style="color: var(--state-success);"></i>
</div>
