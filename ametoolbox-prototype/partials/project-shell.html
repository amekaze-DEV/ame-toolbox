<!-- Key design tokens reference:
     Primary:        var(--ame-primary)         #8F4100 (light) / #FFB87B (dark)
     On-Primary:     var(--ame-on-primary)      #FFFFFF / #4C2700
     Primary-Container: var(--ame-primary-container) #FFDCBE / #6B3900
     Surface:        var(--ame-surface)         #FFF8F4 / #1A120D
     On-Surface:     var(--ame-on-surface)      #221A14 / #F2DFD2
     Surface-Variant:var(--ame-surface-variant) #F3DFD1 / #51443A
     Outline:        var(--ame-outline)         #847468 / #9F8D80
     Error:          var(--ame-error)           #BA1A1A / #FFB4AB
     Success:        var(--state-success)       #2D7D46 / #7DD99A
     Warning:        var(--state-warning)       #F9A825 / #FFD466

     Radius: small=4px, medium=12px, large=16px, full=9999px
     Duration: short=200ms, medium=300ms, long=450ms
     Easing: standard/emphasized = cubic-bezier(0.2, 0, 0, 1)

     Typography:
     .t-display-large   57px/64px
