<!-- ============================================================
     AMEToolbox — Subpage Header Shared Fragment
     Shared by: module-management, settings, theme-settings,
                layout-settings, sync-settings
     Contains: subpage app bar with back button, settings list tile,
               MD3 switch reference, settings section container
     Leaf pages INLINE these patterns — this file is the canonical reference.
     ============================================================ -->

<!-- ===== SHARED: Subpage App Bar with Back Button ===== -->
<!-- data-dom-id="back-settings" or "back-home" wired by Main Agent per page -->
<header class="ame-subpage-bar flex items-center gap-2 px-4 h-14 bg-surface-container text-on-surface border-b border-outline-variant sticky top-0 z-10">
  <button data-dom-id="back-settings" class="state-layer p-2 rounded-full text-on-surface hover:text-primary" aria-label="返回">
    <i data-lucide="arrow-left" class="w-5 h-5"></i>
  </button>
  <span class="t-title-medium flex-1">SUBPAGE TITLE</span>
</header>

<!-- ===== SHARED: Settings Section Container ===== -->
<!-- Section with optional toggle header -->
<section class="ame-settings-section">
  <!-- Section header (static label, not clickable) -->
  <div class="px-4 pt-4 pb-2">
    <span class="t-label-large text-primary font-medium">SECTION LABEL</span>
  </div>
  <!-- Section body: list of settings tiles -->
  <div class="bg-surface-container-low rounded-2xl mx-4 overflow-hidden">
    <!-- Settings tiles go here -->
  </div>
</section>

<!-- ===== SHARED: Settings Section with Toggle Header ===== -->
<section class="ame-settings-section">
  <div class="flex items-center justify-between px-4 pt-4 pb-2">
    <span class="t-label-large text-primary font-medium">SECTION LABEL</span>
    <!-- MD3 Switch (total toggle) -->
    <div class="md3-switch state-layer" data-checked="true" role="switch" tabindex="0">
      <div class="md3-switch-thumb"></div>
    </div>
  </div>
  <div class="bg-surface-container-low rounded-2xl mx-4 overflow-hidden ame-toggle-body">
    <!-- Settings tiles (hidden when toggle is off) -->
  </div>
</section>

<!-- ===== SHARED: Settings List Tile (navigation) ===== -->
<!-- data-dom-id enables interaction wiring; summary value on right -->
<div class="ame-settings-tile state-layer flex items-center gap-4 px-4 py-3 cursor-pointer border-b border-outline-variant last:border-b-0" data-dom-id="link-theme-settings">
  <i data-lucide="palette" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
  <div class="flex-1 min-w-0">
    <div class="t-body-large text-on-surface">主题与配色</div>
  </div>
  <span class="t-body-medium text-on-surface-variant">明亮 · 安全橙</span>
  <i data-lucide="chevron-right" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
</div>

<!-- ===== SHARED: Settings List Tile (with inline switch) ===== -->
<div class="ame-settings-tile flex items-center gap-4 px-4 py-3 border-b border-outline-variant last:border-b-0">
  <i data-lucide="hash" class="w-5 h-5 text-on-surface-variant shrink-0"></i>
  <div class="flex-1 min-w-0">
    <div class="t-body-large text-on-surface">计数器</div>
    <div class="t-body-small text-on-surface-variant">产线计数工具</div>
  </div>
  <div class="md3-switch state-layer" data-checked="true" role="switch" tabindex="0">
    <div class="md3-switch-thumb"></div>
  </div>
</div>

<!-- ===== SHARED: MD3 Switch Component Reference ===== -->
<!--
MD3 Switch usage:
  Off state: <div class="md3-switch" data-checked="false"><div class="md3-switch-thumb"></div></div>
  On state:  <div class="md3-switch" data-checked="true"><div class="md3-switch-thumb"></div></div>
  CSS is defined in project-shell.html shared styles.
  Toggle via JS: element.setAttribute('data-checked', 'true'|'false')
-->
